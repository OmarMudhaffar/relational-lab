<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A free 14-day interactive database course: a real SQL engine in your browser, graded exercises, quizzes and spaced review.">
<meta property="og:title" content="Relational Lab">
<meta property="og:description" content="A free 14-day interactive database course: a real SQL engine in your browser, graded exercises, quizzes and spaced review.">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Relational Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: syllabus rail on the left, a reading column for lessons, console-style editors and result grids inside it, tutor drawer on the right. */
:root {
  --bg: #F2F3EF;
  --surface: #FCFCFA;
  --bg2: #E7E9E3;
  --ink: #1A2028;
  --muted: #5B646D;
  --line: #D2D6CE;
  --accent: #0A6B72;
  --accent-soft: #D7ECEC;
  --hl: #A85F00;
  --hl-soft: #F6E7CF;
  --ok: #2C7A4B;
  --ok-soft: #DCEFE2;
  --bad: #B0281F;
  --bad-soft: #F7DEDB;
  --code-bg: #ECEEE9;
  --kw: #0A6B72;
  --str: #9A4D00;
  --num: #6B3FA0;
  --cmt: #7C858C;
  --shadow: 0 1px 2px rgba(20,30,40,.06), 0 6px 24px rgba(20,30,40,.06);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --rail: 268px;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161B; --surface: #181E25; --bg2: #212932; --ink: #E3E7EB; --muted: #98A2AC; --line: #2D3741;
    --accent: #52BFC4; --accent-soft: #173538; --hl: #E3A64B; --hl-soft: #3A2C17;
    --ok: #5CC28A; --ok-soft: #173327; --bad: #F07B70; --bad-soft: #3B1D1B; --code-bg: #0D1115;
    --kw: #61C9CD; --str: #E9AE6A; --num: #B99AE8; --cmt: #6E7983;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161B; --surface: #181E25; --bg2: #212932; --ink: #E3E7EB; --muted: #98A2AC; --line: #2D3741;
  --accent: #52BFC4; --accent-soft: #173538; --hl: #E3A64B; --hl-soft: #3A2C17;
  --ok: #5CC28A; --ok-soft: #173327; --bad: #F07B70; --bad-soft: #3B1D1B; --code-bg: #0D1115;
  --kw: #61C9CD; --str: #E9AE6A; --num: #B99AE8; --cmt: #6E7983;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
a.btn { text-decoration: none; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, kbd, pre, textarea.ed-input { font-family: var(--f-mono); }
code { font-size: .88em; background: var(--code-bg); padding: .1em .35em; border-radius: 3px; }
kbd { font-size: .78em; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 .35em; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.15; margin: 0; }
.eyebrow { font: 600 11.5px/1 var(--f-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* ---------- shell ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand b { font: 800 19px/1 var(--f-display); font-stretch: 118%; letter-spacing: -.01em; white-space: nowrap; }
.brand span { font: 500 11px/1 var(--f-mono); color: var(--muted); letter-spacing: .06em; white-space: nowrap; }
.topbar .spacer { flex: 1; }
.meter { display: flex; align-items: center; gap: 8px; font: 500 12px var(--f-mono); color: var(--muted); }
.meter .track { width: 120px; height: 6px; background: var(--bg2); border-radius: 3px; overflow: hidden; }
.meter .fill { height: 100%; background: var(--accent); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: var(--radius); cursor: pointer; font-size: 14px; line-height: 1.3; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon-btn { display: none; }
.layout { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: calc(100% - 53px); }
.rail { border-right: 1px solid var(--line); padding: 18px 12px 40px; position: sticky; top: calc(53px + env(safe-area-inset-top, 0px)); height: calc(100vh - 53px); overflow-y: auto; background: var(--bg); }
.rail h4 { margin: 18px 10px 6px; font: 600 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.rail h4:first-child { margin-top: 0; }
.navlink { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--radius); text-decoration: none; color: var(--ink); font-size: 14px; line-height: 1.3; }
.navlink:hover { background: var(--bg2); }
.navlink.active { background: var(--accent-soft); }
.navlink .num { font: 600 12px var(--f-mono); color: var(--muted); }
.navlink.active .num { color: var(--accent); }
.navlink .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navlink .lbl small { display: block; font: 500 10.5px var(--f-mono); color: var(--muted); letter-spacing: .05em; }
.ring { width: 18px; height: 18px; }
.badge { font: 600 11px var(--f-mono); background: var(--hl-soft); color: var(--hl); padding: 1px 7px; border-radius: 10px; }
main { padding-block: 28px 80px; padding-inline: clamp(16px, 4vw, 48px); min-width: 0; }
.col { max-width: 860px; margin: 0 auto; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: end; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
.hero h1 { font-size: clamp(30px, 4.4vw, 46px); font-weight: 800; font-stretch: 112%; letter-spacing: -.02em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { color: var(--muted); max-width: 54ch; margin: 14px 0 20px; font-size: 16.5px; }
.hero .actions { display: flex; flex-wrap: wrap; gap: 10px; }
.map { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.map a { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 5px; display: flex; flex-direction: column; justify-content: space-between; padding: 6px; text-decoration: none; color: var(--ink); background: var(--surface); position: relative; overflow: hidden; }
.map a .d { font: 700 13px/1 var(--f-mono); position: relative; }
.map a .t { font: 600 8.5px/1.1 var(--f-mono); color: var(--muted); letter-spacing: .04em; position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map a .f { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent-soft); }
.map a.today { outline: 2px solid var(--hl); outline-offset: 1px; }
.map-caption { display: flex; justify-content: space-between; font: 500 11px var(--f-mono); color: var(--muted); margin-top: 8px; gap: 8px; flex-wrap: wrap; }
.section { padding-block: 32px; border-bottom: 1px solid var(--line); }
.section:last-child { border-bottom: 0; }
.section > h2 { font-size: 24px; font-weight: 750; font-stretch: 108%; margin-bottom: 6px; }
.section > p.lead { color: var(--muted); margin: 0 0 20px; max-width: 65ch; }
.routine { display: flex; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
.routine div { min-width: 118px; padding: 10px 12px; background: var(--surface); border-right: 1px solid var(--line); min-width: 0; }
.routine div:last-child { border-right: 0; }
.routine b { display: block; font: 600 12px var(--f-mono); color: var(--accent); }
.routine span { display: block; font-size: 13.5px; font-weight: 600; }
.routine small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.35; margin-top: 3px; }
.principles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; }
.principle { padding: 14px 0; border-top: 1px solid var(--line); }
.principle h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.principle p { margin: 0; font-size: 14.5px; color: var(--muted); }
.principle .src { font: 500 11.5px var(--f-mono); color: var(--muted); margin-top: 6px; display: block; opacity: .85; }
.principle .feat { color: var(--ink); }
.weeks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.weeks ol { list-style: none; padding: 0; margin: 0; }
.weeks li { display: grid; grid-template-columns: 54px minmax(0,1fr); gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.weeks li span { font: 600 12px/1.9 var(--f-mono); color: var(--muted); }
.weeks h3 { font-size: 15px; margin-bottom: 8px; }

/* ---------- day ---------- */
.dayhead { padding-bottom: 18px; }
.dayhead .eyebrow { color: var(--accent); }
.dayhead h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; font-stretch: 110%; letter-spacing: -.015em; margin: 8px 0 12px; }
.goals { margin: 0; padding-left: 20px; color: var(--muted); }
.goals li { margin: 2px 0; }
.steps-nav { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin: 18px 0 26px; position: sticky; top: calc(53px + env(safe-area-inset-top, 0px)); background: var(--bg); z-index: 5; overflow-x: auto; }
.steps-nav button { border: 0; background: none; padding: 12px 16px 11px; cursor: pointer; border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 8px; white-space: nowrap; color: var(--muted); font-weight: 500; }
.steps-nav button b { font: 600 11px var(--f-mono); width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--bg2); color: var(--muted); }
.steps-nav button.on { color: var(--ink); border-bottom-color: var(--accent); }
.steps-nav button.on b { background: var(--accent); color: var(--surface); }
.steps-nav button.done b { background: var(--ok-soft); color: var(--ok); }
.seg { padding: 4px 0 30px; }
.seg + .seg { border-top: 1px solid var(--line); padding-top: 26px; }
.seg h2 { font-size: 21px; font-weight: 700; font-stretch: 104%; margin-bottom: 10px; display: flex; gap: 12px; align-items: baseline; }
.seg h2 .n { font: 600 12px var(--f-mono); color: var(--muted); }
.prose { max-width: 68ch; }
.prose p { margin: 0 0 12px; }
.prose ul, .prose ol { margin: 0 0 12px; padding-left: 22px; }
.prose li { margin: 3px 0; }
.prose ol.steps { list-style: none; padding: 0; counter-reset: s; display: grid; gap: 4px; }
.prose ol.steps li { counter-increment: s; position: relative; padding-left: 28px; }
.prose ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; font: 600 12px/2 var(--f-mono); color: var(--accent); }
table.mini { border-collapse: collapse; margin: 6px 0 14px; font-size: 14px; display: block; overflow-x: auto; max-width: 100%; }
table.mini th, table.mini td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; vertical-align: top; }
table.mini th { background: var(--bg2); font-weight: 600; font-size: 13px; }
table.mini td { background: var(--surface); }
.callout { border: 1px solid var(--line); background: var(--surface); padding: 12px 14px; border-radius: var(--radius); margin: 8px 0 14px; font-size: 14.5px; }
.callout.warn { border-color: var(--hl); background: var(--hl-soft); }
pre.code { background: var(--code-bg); padding: 12px 14px; border-radius: var(--radius); overflow-x: auto; font-size: 13.5px; line-height: 1.55; margin: 6px 0 14px; }
figure.diagram { margin: 10px 0 16px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; color: var(--ink); }
figure.diagram svg { max-width: 100%; height: auto; display: block; margin: 0 auto; font-family: var(--f-mono); }
figure.diagram figcaption { font-size: 13px; color: var(--muted); margin-top: 8px; }

/* editor */
.console { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin: 12px 0 6px; overflow: hidden; }
.ed { position: relative; display: grid; background: var(--code-bg); }
.ed > * { grid-area: 1 / 1; margin: 0; padding: 12px 14px; font: 13.5px/1.6 var(--f-mono); white-space: pre-wrap; word-break: break-word; tab-size: 2; border: 0; min-width: 0; }
.ed pre { pointer-events: none; color: var(--ink); }
.ed textarea { resize: none; background: transparent; color: transparent; caret-color: var(--ink); overflow: hidden; outline: none; min-height: 3.4em; }
.ed textarea::selection { background: var(--accent-soft); color: transparent; }
.ed:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
.tk-kw { color: var(--kw); font-weight: 600; }
.tk-str { color: var(--str); }
.tk-num { color: var(--num); }
.tk-cmt { color: var(--cmt); font-style: italic; }
.tk-fn { color: var(--ink); font-weight: 500; text-decoration: underline dotted var(--line); text-underline-offset: 3px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); }
.toolbar .hint-k { margin-left: auto; font: 500 11.5px var(--f-mono); color: var(--muted); }
.out { border-top: 1px solid var(--line); }
.out .meta { font: 500 12px var(--f-mono); color: var(--muted); padding: 6px 12px; display: flex; gap: 12px; flex-wrap: wrap; }
.grid-wrap { overflow: auto; max-height: 360px; }
table.grid { border-collapse: collapse; font: 13px/1.45 var(--f-mono); width: max-content; min-width: 100%; }
table.grid th { position: sticky; top: 0; background: var(--bg2); text-align: left; font-weight: 600; padding: 5px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.grid td { padding: 4px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
table.grid td.n { text-align: right; font-variant-numeric: tabular-nums; }
table.grid td.null { color: var(--muted); font-style: italic; }
table.grid tr:last-child td { border-bottom: 0; }
.err { color: var(--bad); background: var(--bad-soft); padding: 10px 12px; font: 13px/1.5 var(--f-mono); white-space: pre-wrap; }
.note { font-size: 13.5px; color: var(--muted); margin: 4px 0 0; }

/* predict */
.predict { border: 1px solid var(--hl); border-radius: var(--radius); background: var(--surface); margin: 14px 0 6px; overflow: hidden; }
.predict .ph { background: var(--hl-soft); color: var(--hl); font: 600 11.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 7px 12px; }
.predict .pb { padding: 12px 14px; }
.predict .q { font-weight: 600; margin-bottom: 10px; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 8px 12px; cursor: pointer; display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 6px; line-height: 1.45; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt b { font: 600 12px/1.6 var(--f-mono); color: var(--muted); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.why { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--bg2); font-size: 14.5px; border-radius: 0 var(--radius) var(--radius) 0; }

/* exercises */
.ex { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin-bottom: 18px; overflow: hidden; }
.ex.done { border-color: var(--ok); }
.ex-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--bg2); }
.ex-h .id { font: 600 12px var(--f-mono); color: var(--muted); }
.lvl { display: inline-flex; gap: 3px; }
.lvl i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.lvl i.on { background: var(--hl); }
.status { margin-left: auto; font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; }
.status.done { background: var(--ok-soft); color: var(--ok); }
.status.todo { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.status.try { background: var(--hl-soft); color: var(--hl); }
.ex-p { padding: 12px 14px 0; }
.ex .console { margin: 10px 14px 12px; }
.fb { margin: 0 14px 12px; padding: 10px 12px; border-radius: var(--radius); font-size: 14.5px; }
.fb.pass { background: var(--ok-soft); color: var(--ok); }
.fb.fail { background: var(--bad-soft); color: var(--bad); }
.fb .sub { color: var(--ink); display: block; margin-top: 4px; font-size: 13.5px; }
.hints { margin: 0 14px 12px; display: grid; gap: 6px; }
.hints div { font-size: 14px; padding: 7px 10px; background: var(--hl-soft); border-radius: var(--radius); }
.hints div b { font: 600 11px var(--f-mono); color: var(--hl); margin-right: 6px; }
.sol { margin: 0 14px 12px; }
.sol .lab { font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.exp { margin: 0 14px 12px; border: 1px dashed var(--line); border-radius: var(--radius); overflow: hidden; }
.exp .lab { font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 12px; }
.listing { display: grid; gap: 10px; }
.pit { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.pit li { padding: 10px 12px 10px 36px; position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: 14.5px; }
.pit li::before { content: "!"; position: absolute; left: 12px; top: 10px; width: 16px; height: 16px; border-radius: 50%; background: var(--bad-soft); color: var(--bad); font: 700 11px/16px var(--f-mono); text-align: center; }
.next-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; flex-wrap: wrap; }

/* quiz + review */
.quiz { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 20px; }
.quiz .qn { font: 600 12px var(--f-mono); color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 10px; }
.quiz .qq { font-size: 17px; font-weight: 600; margin-bottom: 14px; line-height: 1.45; }
.score { display: flex; gap: 22px; align-items: baseline; flex-wrap: wrap; margin-bottom: 18px; }
.score b { font: 800 40px/1 var(--f-display); font-stretch: 110%; }
.score span { color: var(--muted); }
.boxes { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; margin: 10px 0 22px; }
.boxes div { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 8px 10px; }
.boxes b { display: block; font: 700 22px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.boxes small { font: 500 11px var(--f-mono); color: var(--muted); }

/* teach */
textarea.plain { width: 100%; min-height: 180px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); font: 15px/1.6 var(--f-body); resize: vertical; }
.fbk { margin-top: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px; }
.fbk h3 { font-size: 15px; margin: 12px 0 4px; }
.fbk h3:first-child { margin-top: 0; }
.fbk ul { margin: 0; padding-left: 20px; }
.meterbar { height: 8px; background: var(--bg2); border-radius: 4px; overflow: hidden; margin: 6px 0 12px; }
.meterbar i { display: block; height: 100%; background: var(--accent); }

/* playground */
.pg { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 22px; align-items: start; }
.schema { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font-size: 13px; }
.schema details { border-bottom: 1px solid var(--line); }

<script>
// University dataset used by every lesson and exercise.
// Deterministic: the same SQL is produced on every load, so graded answers are stable.
var LAB = (typeof LAB !== 'undefined') ? LAB : {};
LAB.days = LAB.days || [];

LAB.SCHEMA_SQL = `
PRAGMA foreign_keys = ON;

CREATE TABLE departments (
  dept_id   INTEGER PRIMARY KEY,
  name      TEXT NOT NULL UNIQUE,
  building  TEXT,
  budget    INTEGER CHECK (budget >= 0)
);

CREATE TABLE instructors (
  instructor_id INTEGER PRIMARY KEY,
  name          TEXT NOT NULL,
  dept_id       INTEGER REFERENCES departments(dept_id),
  salary        INTEGER NOT NULL CHECK (salary > 0),
  hire_date     TEXT NOT NULL,
  mentor_id     INTEGER REFERENCES instructors(instructor_id)
);

CREATE TABLE students (
  student_id  INTEGER PRIMARY KEY,
  name        TEXT NOT NULL,
  email       TEXT NOT NULL UNIQUE,
  dept_id     INTEGER REFERENCES departments(dept_id),
  year        INTEGER CHECK (year BETWEEN 1 AND 4),
  city        TEXT,
  birth_date  TEXT,
  advisor_id  INTEGER REFERENCES instructors(instructor_id),
  enrolled_on TEXT NOT NULL
);

CREATE TABLE courses (
  course_id TEXT PRIMARY KEY,
  title     TEXT NOT NULL,
  dept_id   INTEGER NOT NULL REFERENCES departments(dept_id),
  credits   INTEGER NOT NULL CHECK (credits BETWEEN 1 AND 6)
);

CREATE TABLE prereqs (
  course_id TEXT REFERENCES courses(course_id),
  prereq_id TEXT REFERENCES courses(course_id),
  PRIMARY KEY (course_id, prereq_id)
);

CREATE TABLE sections (
  section_id    INTEGER PRIMARY KEY,
  course_id     TEXT NOT NULL REFERENCES courses(course_id),
  instructor_id INTEGER REFERENCES instructors(instructor_id),
  semester      TEXT NOT NULL CHECK (semester IN ('Fall','Spring','Summer')),
  year          INTEGER NOT NULL,
  room          TEXT,
  capacity      INTEGER NOT NULL
);

CREATE TABLE enrollments (
  student_id INTEGER REFERENCES students(student_id),
  section_id INTEGER REFERENCES sections(section_id),
  grade      TEXT CHECK (grade IN ('A','B','C','D','F')),
  score      REAL,
  PRIMARY KEY (student_id, section_id)
);

CREATE TABLE payments (
  payment_id INTEGER PRIMARY KEY,
  student_id INTEGER NOT NULL REFERENCES students(student_id),
  amount     REAL NOT NULL,
  paid_on    TEXT NOT NULL,
  method     TEXT NOT NULL CHECK (method IN ('card','bank','cash'))
);
`;

LAB.buildSeedSQL = function () {
  var out = [];
  function q(v) {
    if (v === null || v === undefined) return 'NULL';
    if (typeof v === 'number') return String(v);
    return "'" + String(v).replace(/'/g, "''") + "'";
  }
  function ins(table, rows) {
    rows.forEach(function (r) { out.push('INSERT INTO ' + table + ' VALUES (' + r.map(q).join(', ') + ');'); });
  }
  // mulberry32: tiny seeded PRNG
  var seed = 20261005;
  function rnd() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }

  ins('departments', [
    [1, 'Computer Science', 'Turing Hall', 950000],
    [2, 'Mathematics', 'Noether Hall', 520000],
    [3, 'Physics', 'Curie Building', 610000],
    [4, 'Biology', 'Darwin Labs', 480000],
    [5, 'Economics', 'Smith Hall', 400000],
    [6, 'History', 'Ibn Khaldun Hall', 210000],
    [7, 'Electrical Engineering', 'Tesla Center', 870000],
    [8, 'Philosophy', 'Ibn Rushd Hall', 120000]
  ]);

  ins('instructors', [
    [101, 'Layla Haddad', 1, 98000, '2012-08-15', null],
    [102, 'Marco Rossi', 1, 87000, '2016-01-10', 101],
    [103, 'Aisha Rahman', 1, 76000, '2020-09-01', 101],
    [104, 'David Kim', 2, 91000, '2010-08-20', null],
    [105, 'Sofia Petrova', 2, 72000, '2019-01-07', 104],
    [106, 'Omar Farouk', 3, 95000, '2011-02-14', null],
    [107, 'Hannah Becker', 3, 68000, '2022-08-29', 106],
    [108, 'Yusuf Demir', 4, 83000, '2014-09-03', null],
    [109, 'Grace Okafor', 4, 79000, '2017-08-21', 108],
    [110, 'Lucas Martin', 5, 88000, '2013-01-15', null],
    [111, 'Mei Chen', 5, 70000, '2021-08-30', 110],
    [112, 'Tariq Aziz', 6, 64000, '2015-09-10', null],
    [113, 'Elena Garcia', 7, 102000, '2009-08-17', null],
    [114, 'Nikhil Rao', 7, 81000, '2018-01-08', 113],
    [115, 'Fatima Zahra', 7, 74000, '2023-01-09', 113],
    [116, 'Jonas Berg', null, 60000, '2024-08-26', 101]
  ]);

  var first = ['Ahmed','Sara','Ali','Noor','Yousef','Mariam','Hassan','Zainab','Karim','Lina','Omar','Huda','Adam','Emma','Liam','Olivia','Noah','Ava','Mateo','Chloe','Ibrahim','Rania','Samir','Dina','Leo','Mia','Ethan','Amira','Khalid','Salma','Ravi','Priya','Kenji','Yuki','Ivan','Anya','Tomas','Ines','Bilal','Reem'];
  var last = ['Al-Sayed','Haddad','Nasser','Khalil','Saleh','Mansour','Ibrahim','Jaber','Hamdan','Qasim','Smith','Johnson','Garcia','Muller','Rossi','Tanaka','Patel','Kovac','Silva','Novak'];
  var cities = ['Baghdad','Amman','Cairo','Dubai','Riyadh','Beirut','Istanbul','London','Berlin', null];
  var students = [];
  for (var i = 0; i < 40; i++) {
    var id = 1001 + i;
    var fn = first[i], ln = last[(i * 7) % last.length];
    var dept = (i % 13 === 12) ? null : [1,1,1,2,3,4,5,6,7,7,1,2,3,5,4][Math.floor(rnd() * 15)];
    var year = 1 + Math.floor(rnd() * 4);
    var city = cities[Math.floor(rnd() * cities.length)];
    var by = 2006 - year + (rnd() < 0.3 ? -1 : 0);
    var bm = 1 + Math.floor(rnd() * 12), bd = 1 + Math.floor(rnd() * 28);
    var bdate = by + '-' + String(bm).padStart(2,'0') + '-' + String(bd).padStart(2,'0');
    var advisorPool = { 1:[101,102,103], 2:[104,105], 3:[106,107], 4:[108,109], 5:[110,111], 6:[112], 7:[113,114,115] };
    var advisor = dept && rnd() < 0.85 ? pick(advisorPool[dept]) : null;
    var enrolledYear = 2026 - year;
    var enrolled = enrolledYear + '-09-' + String(1 + Math.floor(rnd() * 10)).padStart(2,'0');
    var email = (fn + '.' + ln).toLowerCase().replace(/[^a-z.]/g,'') + '@uni.edu';
    students.push([id, fn + ' ' + ln, email, dept, year, city, bdate, advisor, enrolled]);
  }
  ins('students', students);

  var courses = [
    ['CS101','Introduction to Programming',1,4],['CS201','Data Structures',1,4],['CS220','Databases',1,3],
    ['CS310','Algorithms',1,4],['CS340','Operating Systems',1,4],['CS420','Distributed Systems',1,3],
    ['MA101','Calculus I',2,4],['MA102','Calculus II',2,4],['MA210','Linear Algebra',2,3],['MA250','Discrete Mathematics',2,3],
    ['PH101','Mechanics',3,4],['PH201','Electromagnetism',3,4],
    ['BI101','Cell Biology',4,3],['BI230','Genetics',4,3],
    ['EC101','Microeconomics',5,3],['EC102','Macroeconomics',5,3],['EC300','Econometrics',5,4],
    ['HI110','World History',6,3],['HI240','History of Science',6,3],
    ['EE101','Circuits',7,4],['EE230','Signals and Systems',7,4],['EE330','Embedded Systems',7,3],
    ['PL100','Logic and Reasoning',8,3]
  ];
  ins('courses', courses);

  ins('prereqs', [
    ['CS201','CS101'],['CS220','CS201'],['CS310','CS201'],['CS310','MA250'],['CS340','CS201'],['CS420','CS340'],['CS420','CS220'],
    ['MA102','MA101'],['MA210','MA101'],['PH201','PH101'],['PH201','MA102'],['BI230','BI101'],
    ['EC102','EC101'],['EC300','EC102'],['EC300','MA210'],['EE230','EE101'],['EE230','MA102'],['EE330','EE230'],['EE330','CS101']
  ]);

  var teachers = { 1:[101,102,103,116], 2:[104,105], 3:[106,107], 4:[108,109], 5:[110,111], 6:[112], 7:[113,114,115], 8:[] };
  var rooms = ['A101','A102','B201','B202','C10','C11','LAB1','LAB2','AUD'];
  var sections = [], sid = 1;
  var terms = [['Fall',2024],['Spring',2025],['Fall',2025],['Spring',2026],['Fall',2026]];
  courses.forEach(function (c) {
    var n = (c[0] === 'PL100') ? 1 : (c[0] === 'HI240' ? 0 : 1 + Math.floor(rnd() * 2) + (c[2] === 1 ? 1 : 0));
    for (var k = 0; k < n; k++) {
      var term = terms[Math.floor(rnd() * terms.length)];
      var pool = teachers[c[2]];
      var instr = pool.length ? pick(pool) : null;
      sections.push([sid++, c[0], instr, term[0], term[1], pick(rooms), pick([25, 30, 40, 60, 120])]);
    }
  });
  ins('sections', sections);

  function letter(s) { return s >= 90 ? 'A' : s >= 80 ? 'B' : s >= 70 ? 'C' : s >= 60 ? 'D' : 'F'; }
  var enr = [], seen = {};
  students.forEach(function (s) {
    var count = (s[0] === 1040 || s[0] === 1033) ? 0 : 2 + Math.floor(rnd() * 5);
    var skill = 55 + rnd() * 40;
    for (var k = 0; k < count; k++) {
      var sec = sections[Math.floor(rnd() * sections.length)];
      var key = s[0] + ':' + sec[0];
      if (seen[key]) continue; seen[key] = 1;
      var current = (sec[3] === 'Fall' && sec[4] === 2026);
      var score = current ? null : Math.round(Math.min(100, Math.max(30, skill + (rnd() - 0.5) * 30)) * 10) / 10;
      enr.push([s[0], sec[0], score === null ? null : letter(score), score]);
    }
  });
  ins('enrollments', enr);

  var pays = [], pid = 1;
  students.forEach(function (s) {
    var n = (s[0] === 1040) ? 0 : 1 + Math.floor(rnd() * 4);
    for (var k = 0; k < n; k++) {
      var m = 1 + Math.floor(rnd() * 12), d = 1 + Math.floor(rnd() * 28);
      var y = rnd() < 0.5 ? 2025 : 2026;
      if (y === 2026 && m > 9) m = 9;
      pays.push([pid++, s[0], pick([250, 500, 750, 1000, 1250, 1500]), y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0'), pick(['card','card','bank','cash'])]);
    }
  });
  ins('payments', pays);

  return out.join('\n');
};

LAB.TABLE_NOTES = {
  departments: 'One row per academic department.',
  instructors: 'Teaching staff. mentor_id points to another instructor (self-reference).',
  students: 'One row per student. dept_id is the major (NULL = undeclared). advisor_id points to an instructor.',
  courses: 'The course catalog. course_id is a text code like CS220.',
  prereqs: 'Course X requires course Y. A many-to-many relationship of courses with themselves.',
  sections: 'A course taught in a specific term by one instructor.',
  enrollments: 'Which student took which section. grade and score are NULL while the course is in progress (Fall 2026).',
  payments: 'Tuition payments made by students.'
};

if (typeof module !== 'undefined') module.exports = LAB;

// ---- day01.js
LAB.days.push({
  n: 1,
  week: 1,
  tag: 'SELECT',
  title: 'Tables, Keys and Your First Queries',
  hours: 2.5,
  goals: [
    'Describe a table in relational terms: relation, tuple, attribute, domain',
    'Explain what primary keys and foreign keys guarantee',
    'Write SELECT queries with column lists, aliases, expressions, DISTINCT, ORDER BY and LIMIT'
  ],
  lesson: [
    {
      h: 'Why databases exist',
      html: `<p>Before databases, programs saved data in their own files. Every program had its own format, two programs could overwrite each other, and a crash halfway through a save left the file broken. A <strong>database management system (DBMS)</strong> solves this once for everyone. It stores the data, answers questions about it, lets many users work at the same time, and keeps the data correct after crashes.</p>
<p>A <strong>relational</strong> DBMS (PostgreSQL, MySQL, SQL Server, Oracle, SQLite) stores everything in tables and lets you ask questions in one language: <strong>SQL</strong>. The lab you are using runs a real SQLite engine inside your browser, so every query you write here is actually executed.</p>`
    },
    {
      h: 'The vocabulary: relation, tuple, attribute',
      html: `<p>Your teacher may use the formal words. They map one-to-one to the everyday words:</p>
<table class="mini"><thead><tr><th>Formal (theory)</th><th>Everyday (SQL)</th><th>In our data</th></tr></thead><tbody>
<tr><td>Relation</td><td>Table</td><td><code>students</code></td></tr>
<tr><td>Tuple</td><td>Row</td><td>One student, e.g. Ahmed Al-Sayed</td></tr>
<tr><td>Attribute</td><td>Column</td><td><code>email</code></td></tr>
<tr><td>Domain</td><td>Data type + allowed values</td><td><code>year</code> is an integer from 1 to 4</td></tr>
<tr><td>Degree / Cardinality</td><td>Number of columns / rows</td><td>students has degree 9, cardinality 40</td></tr>
</tbody></table>
<p>Two rules from theory matter in practice. Rows have <strong>no built-in order</strong>: a table is a set, so if you need an order you must ask for it. And every row must be <strong>identifiable</strong>, which is the job of keys.</p>`
    },
    {
      h: 'Keys hold the design together',
      html: `<p>A <strong>primary key (PK)</strong> is a column (or group of columns) whose value is unique and never NULL. It names exactly one row. <code>students.student_id</code> is a primary key.</p>
<p>A <strong>foreign key (FK)</strong> is a column whose values must match a primary key in another table. <code>students.dept_id</code> references <code>departments.dept_id</code>, so the database refuses a student whose department does not exist. This rule is called <strong>referential integrity</strong>.</p>
<div class="callout"><strong>Other key words you will see in exams.</strong> A <em>superkey</em> is any set of columns that is unique. A <em>candidate key</em> is a minimal superkey (remove any column and it stops being unique). The primary key is the candidate key the designer picked. <code>email</code> is also a candidate key in <code>students</code>, which is why it is declared <code>UNIQUE</code>.</div>
<p>Open the <strong>Schema</strong> panel on the right at any time to see every table, its columns and its keys.</p>`
    },
    {
      h: 'SELECT and FROM',
      html: `<p>The smallest useful query names the columns you want and the table they come from. <code>*</code> means every column. In real applications, list the columns you need: it is clearer and it does not break when someone adds a column later.</p>`,
      sql: `SELECT name, email, year
FROM students;`,
      note: 'Press Run (or Ctrl/Cmd + Enter). Then edit the column list and run it again.'
    },
    {
      h: 'Expressions and aliases',
      html: `<p>A column in the SELECT list can be any expression: arithmetic, text concatenation (<code>||</code> in standard SQL and SQLite), or a function call. Use <code>AS</code> to give the result column a readable name. An alias with spaces needs double quotes.</p>`,
      sql: `SELECT name,
       salary,
       salary / 12 AS monthly_salary,
       ROUND(salary * 1.05) AS "salary after 5% raise"
FROM instructors;`
    },
    {
      h: 'Removing duplicates with DISTINCT',
      html: `<p>A query result can contain duplicate rows even though a table should not. <code>DISTINCT</code> keeps one copy of each different row. It applies to the whole row, not to the first column only.</p>`,
      predict: {
        sql: `SELECT DISTINCT city FROM students;`,
        q: 'Some students have no city (NULL). How does DISTINCT treat several NULL cities?',
        options: ['It removes all NULL rows', 'It keeps one NULL row', 'It keeps every NULL row because NULL is never equal to NULL', 'It raises an error'],
        answer: 1,
        why: 'DISTINCT and GROUP BY treat all NULLs as one group, so exactly one NULL row remains. This is one of the few places where NULLs are treated as "the same".'
      }
    },
    {
      h: 'ORDER BY and LIMIT',

LAB.days.push({
  n: 2,
  week: 1,
  tag: 'WHERE',
  title: 'Filtering Rows and Thinking in NULL',
  hours: 2.5,
  goals: [
    'Filter rows with comparison operators, AND, OR, NOT, IN, BETWEEN and LIKE',
    'Explain three-valued logic and why <code>= NULL</code> never matches',
    'Replace missing values with COALESCE and build new values with CASE',
    'Use the most common text and date functions'
  ],
  lesson: [
    {
      h: 'WHERE keeps the rows you want',
      html: `<p><code>WHERE</code> runs right after <code>FROM</code>. It tests a condition on each row. A row stays in the result only if the condition is <strong>TRUE</strong> for that row.</p>
<p>The comparison operators are <code>=</code>, <code>&lt;&gt;</code> (also written <code>!=</code>), <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code> and <code>&gt;=</code>. Text values go in single quotes. Numbers have no quotes.</p>`,
      sql: `SELECT name, year, city
FROM students
WHERE year = 4;`,
      note: 'Change 4 to another year, or try WHERE city = \'Cairo\'.'
    },
    {
      h: 'AND, OR, NOT and the parentheses trap',
      html: `<p>Combine conditions with <code>AND</code> (both must be true), <code>OR</code> (at least one must be true) and <code>NOT</code> (reverse).</p>
<p><strong>AND is evaluated before OR</strong>, like multiplication before addition. This causes a classic bug. Suppose you want 4th-year students from Cairo or Baghdad:</p>
<pre class="code">-- Wrong: means  (city = 'Cairo')  OR  (city = 'Baghdad' AND year = 4)
WHERE city = 'Cairo' OR city = 'Baghdad' AND year = 4

-- Right
WHERE (city = 'Cairo' OR city = 'Baghdad') AND year = 4</pre>
<p>When you mix AND and OR, always write the parentheses. It costs nothing and makes your meaning clear.</p>`,
      predict: {
        sql: `SELECT name, city, year
FROM students
WHERE city = 'Cairo' OR city = 'Baghdad' AND year = 4;`,
        q: 'Will this query return a Cairo student who is in year 1?',
        options: ['Yes', 'No', 'Only if year is NULL', 'The query raises an error'],
        answer: 0,
        why: 'AND binds tighter, so the condition is city = \'Cairo\' OR (city = \'Baghdad\' AND year = 4). Every Cairo student passes, whatever the year.'
      }
    },
    {
      h: 'IN and BETWEEN',
      html: `<p><code>IN (list)</code> is a short way to write many ORs on the same column. <code>BETWEEN a AND b</code> is short for <code>&gt;= a AND &lt;= b</code>. Both ends are <strong>included</strong>.</p>
<p>Because our dates are text in <code>YYYY-MM-DD</code> form, BETWEEN works on them too. They sort the same way as real dates.</p>`,
      sql: `SELECT name, salary, hire_date
FROM instructors
WHERE dept_id IN (1, 7)
  AND salary BETWEEN 75000 AND 100000;`
    },
    {
      h: 'LIKE for patterns',
      html: `<p><code>LIKE</code> compares text with a pattern. Two wildcards exist:</p>
<ul><li><code>%</code> matches any number of characters, including zero.</li><li><code>_</code> matches exactly one character.</li></ul>
<p><code>'CS%'</code> matches every course code that starts with CS. <code>'__1%'</code> matches codes whose third character is 1.</p>
<div class="callout warn"><strong>Case.</strong> In SQLite and MySQL (default settings) LIKE ignores upper/lower case for English letters. In PostgreSQL LIKE is case-sensitive and <code>ILIKE</code> ignores case. To be safe everywhere, write <code>LOWER(col) LIKE '...'</code>.</div>`,
      sql: `SELECT course_id, title
FROM courses
WHERE course_id LIKE 'CS%'
   OR title LIKE '%History%';`
    },
    {
      h: 'NULL means "unknown"',
      html: `<p><code>NULL</code> is not zero and not an empty string. It means the value is <strong>missing or unknown</strong>. Three students have no major, some have no city, and current enrollments have no grade yet.</p>
<p>Any comparison with NULL gives a third truth value: <strong>UNKNOWN</strong>. Is an unknown city equal to Cairo? We cannot know. So <code>city = NULL</code> is UNKNOWN for every row, even rows where city is NULL. WHERE keeps only TRUE rows, so it returns nothing.</p>
<p>To test for NULL, use the special operators <code>IS NULL</code> and <code>IS NOT NULL</code>.</p>`,
      sql: `SELECT name, city
FROM students
WHERE city IS NULL;`,
      predict: {
        sql: `SELECT COUNT(*) FROM students WHERE city = NULL;`,
        q: 'Several students have a NULL city. What number does this query return?',
        options: ['The number of NULL cities', '0', '40', 'An error'],
        answer: 1,
        why: 'city = NULL is UNKNOWN for every row, never TRUE. No row passes the filter, so the count is 0. Use IS NULL instead.'
      }
    },
    {
      h: 'Three-valued logic tables',
      html: `<p>With UNKNOWN in the game, AND and OR follow these rules. Read UNKNOWN as "could be either".</p>
<table class="mini"><thead><tr><th>A</th><th>B</th><th>A AND B</th><th>A OR B</th></tr></thead><tbody>
<tr><td>TRUE</td><td>UNKNOWN</td><td>UNKNOWN</td><td>TRUE</td></tr>
<tr><td>FALSE</td><td>UNKNOWN</td><td>FALSE</td><td>UNKNOWN</td></tr>
<tr><td>UNKNOWN</td><td>UNKNOWN</td><td>UNKNOWN</td><td>UNKNOWN</td></tr>
</tbody></table>
<p>And <code>NOT UNKNOWN</code> is still UNKNOWN. A quick trick: FALSE AND anything is FALSE; TRUE OR anything is TRUE. Everything else that touches UNKNOWN stays UNKNOWN.</p>
<div class="callout warn"><strong>Preview of a famous bug.</strong> <code>x NOT IN (1, 2, NULL)</code> means <code>x &lt;&gt; 1 AND x &lt;&gt; 2 AND x &lt;&gt; NULL</code>. The last part is UNKNOWN, so the whole condition can never be TRUE. A NOT IN list (or subquery) that contains a NULL returns <strong>no rows</strong>. You will meet this again on Day 5.</div>`,

  lesson: [
    {
      h: 'Why joins exist: a filtered Cartesian product',
      html: `<p>A good design stores each fact once. The student row stores <code>dept_id = 7</code>, not the text "Electrical Engineering". The name of the department lives in <code>departments</code>. This avoids copies that can disagree. The price is that a question like "show each student with the name of their department" needs data from <strong>two</strong> tables. A <strong>join</strong> puts them back together.</p>
<p>Think of a join in two steps:</p>
<ol class="steps"><li>Pair <strong>every</strong> row of table A with <strong>every</strong> row of table B. This is the <em>Cartesian product</em> (<code>CROSS JOIN</code>). 40 students × 8 departments = 320 pairs.</li><li>Keep only the pairs where the <code>ON</code> condition is TRUE, for example <code>s.dept_id = d.dept_id</code>.</li></ol>
<p>The engine does not really build all 320 pairs (it is much smarter), but the <strong>result</strong> is always the same as these two steps. If you forget the ON condition, you get the full product, which is almost always a bug.</p>`,
      sql: `SELECT COUNT(*) AS pairs
FROM students
CROSS JOIN departments;`,
      predict: {
        sql: `SELECT COUNT(*) FROM courses CROSS JOIN departments;`,
        q: 'There are 23 courses and 8 departments. How many rows does a CROSS JOIN return?',
        options: ['23', '31', '184', '8'],

        why: 'Every course is paired with every department: 23 × 8 = 184.'

  lesson: [
    {
      h: 'A query inside a query',
      html: `<p>A <strong>subquery</strong> is a SELECT written inside another statement, in parentheses. The inner query runs and its result is used by the outer query. You already know how to answer "What is the average salary?" and "Who earns more than 85000?". A subquery lets you combine them: "Who earns more than the average?"</p>
<p>When a subquery returns exactly <strong>one row and one column</strong>, it is a <strong>scalar subquery</strong>. You can use it anywhere a single value is allowed: in WHERE, in SELECT, even in ORDER BY.</p>`,
      sql: `SELECT name, salary,
       (SELECT ROUND(AVG(salary)) FROM instructors) AS university_avg
FROM instructors
WHERE salary > (SELECT AVG(salary) FROM instructors)
ORDER BY salary DESC;`,
      note: 'The average is computed once. Change > to < to see the instructors below average.'
    },
    {
      h: 'IN with a subquery: a list of values',
      html: `<p>When the subquery returns <strong>one column and many rows</strong>, treat it as a list. <code>IN</code> keeps an outer row if its value appears anywhere in that list.</p>
<p>Read the query below from the inside out. First: which departments have a budget above 500000? Then: which students major in one of them?</p>`,
      sql: `SELECT name, dept_id

WHERE dept_id IN (SELECT dept_id
                  FROM departments
                  WHERE budget > 500000)
ORDER BY dept_id, name;`

    {
      h: 'The NOT IN trap with NULL',
      html: `<p>We want instructors who teach <strong>no</strong> section. <code>NOT IN</code> looks like the obvious tool. But one section (PL100) has no instructor, so the list contains a NULL.</p>
<p>Remember three-valued logic. <code>x NOT IN (101, 102, NULL)</code> means <code>x &lt;&gt; 101 AND x &lt;&gt; 102 AND x &lt;&gt; NULL</code>. The last comparison is UNKNOWN, never TRUE. So the whole condition can never be TRUE, and the query returns <strong>no rows at all</strong>. There is no error message. The result is just silently wrong.</p>`,

        why: 'The list from sections contains a NULL. Every NOT IN test becomes UNKNOWN or FALSE, so nothing passes. Fix it with NOT EXISTS, or add WHERE instructor_id IS NOT NULL inside the subquery.'

    },
    {
      h: 'EXISTS and NOT EXISTS',
      html: `<p><code>EXISTS (subquery)</code> is TRUE if the subquery returns at least one row. It does not care about the values, so people often write <code>SELECT 1</code> inside. It only returns TRUE or FALSE, never UNKNOWN, so <strong>NULLs cannot break it</strong>.</p>
<p>Notice that the subquery below mentions <code>i.instructor_id</code> from the outer query. That makes it a <em>correlated</em> subquery (next segment).</p>`,
      sql: `SELECT name

                  FROM sections s
                  WHERE s.instructor_id = i.instructor_id);`,
      note: 'This is the safe way to write "has no ...". It returns Omar Farouk.'

    {
      h: 'Correlated subqueries: once per outer row',
      html: `<p>A <strong>correlated subquery</strong> refers to a column of the outer query. Logically, it runs again for <strong>each outer row</strong>, with that row's values plugged in.</p>

<figure class="diagram"><svg viewBox="0 0 560 120" role="img" aria-label="For each outer row, the inner query runs with that row's department">

<text x="110" y="45" text-anchor="middle" fill="var(--ink)" font-size="13">outer row: Marco Rossi</text>

      sql: `SELECT i.name, i.dept_id, i.salary

      h: 'Subqueries in FROM: derived tables',
      html: `<p>A subquery in the FROM clause produces a temporary table, called a <strong>derived table</strong>. Most databases require you to give it an alias. This is useful when you need to aggregate twice, for example "the average of per-student counts". You cannot write <code>AVG(COUNT(*))</code> directly, but you can count first and then average the counts.</p>`,

      html: `<p>Many questions can be written either way. The database optimizer often turns an IN subquery into a join internally. But the results can differ in one important way: a JOIN repeats the outer row once for <strong>each</strong> match, while IN or EXISTS keeps the outer row <strong>once</strong>.</p>

LAB.days.push({
  n: 6,
  week: 1,
  tag: 'WINDOW',
  title: 'CTEs and Window Functions',
  hours: 3,
  goals: [
    'Break a long query into named steps with WITH (common table expressions)',
    'Walk hierarchies and chains with recursive CTEs',
    'Compute per-row results over a group without losing rows, using OVER (PARTITION BY ... ORDER BY ...)',
    'Choose correctly between ROW_NUMBER, RANK and DENSE_RANK',
    'Build running totals, moving averages, LAG/LEAD comparisons and percent-of-total columns'
  ],
  lesson: [
    {
      h: 'WITH: give a step a name',
      html: `<p>Yesterday you nested subqueries. Nesting gets hard to read after two levels. A <strong>common table expression (CTE)</strong> lets you write the inner query first, give it a name, and then use that name like a table.</p>
<pre class="code">WITH name AS (
  SELECT ...          -- step 1
)
SELECT ... FROM name; -- step 2 uses step 1</pre>
<p>The CTE exists only while this one statement runs. It is not saved anywhere.</p>`,
      sql: `WITH credits_taken AS (
  SELECT e.student_id, SUM(c.credits) AS credits
  FROM enrollments e
  JOIN sections s ON s.section_id = e.section_id
  JOIN courses  c ON c.course_id  = s.course_id
  GROUP BY e.student_id
)
SELECT st.name, ct.credits
FROM credits_taken ct
JOIN students st ON st.student_id = ct.student_id
WHERE ct.credits >= 20
ORDER BY ct.credits DESC, st.name;`
    },
    {
      h: 'Chaining CTEs',
      html: `<p>You can define several CTEs, separated by commas. Each one may use the CTEs defined before it. Think of it as a small pipeline: each step does one job. This is also the easiest way to <strong>debug</strong> a long query: run <code>SELECT * FROM step1</code> on its own, check it, then move on.</p>`,
      sql: `WITH dept_pay AS (
  SELECT dept_id, AVG(salary) AS avg_salary
  FROM instructors
  WHERE dept_id IS NOT NULL
  GROUP BY dept_id
),
overall AS (
  SELECT AVG(avg_salary) AS mean_of_depts FROM dept_pay
)
SELECT d.name, ROUND(dp.avg_salary) AS avg_salary
FROM dept_pay dp
JOIN departments d ON d.dept_id = dp.dept_id
CROSS JOIN overall o
WHERE dp.avg_salary > o.mean_of_depts
ORDER BY dp.avg_salary DESC;`
    },
    {
      h: 'Recursive CTEs: following a chain',
      html: `<p>CS420 requires CS340 and CS220. Those require CS201, which requires CS101. How do you list <em>all</em> prerequisites, at any depth? A join handles one level. A <strong>recursive CTE</strong> repeats a join until no new rows appear.</p>
<ol class="steps"><li><strong>Anchor member:</strong> the starting rows (the direct prerequisites of CS420).</li><li><strong>Recursive member:</strong> joins the CTE to the table again to find the next level.</li><li>The engine repeats step 2 with the newest rows until a round produces nothing.</li></ol>
<p>Use <code>UNION</code> (not UNION ALL) when the same row could be reached twice. It also protects you from infinite loops if the data has a cycle.</p>`,
      sql: `WITH RECURSIVE chain(course_id, level) AS (
  SELECT prereq_id, 1 FROM prereqs WHERE course_id = 'CS420'   -- anchor
  UNION
  SELECT p.prereq_id, chain.level + 1                          -- recursive step
  FROM prereqs p
  JOIN chain ON p.course_id = chain.course_id
)
SELECT course_id, MIN(level) AS distance
FROM chain
GROUP BY course_id
ORDER BY distance, course_id;`
    },
    {
      h: 'Recursive CTEs: walking a hierarchy',
      html: `<p>The same idea walks a tree such as an organisation chart. Here the anchor is every instructor without a mentor (depth 0). Each round adds the people they mentor, one level deeper. We also build a readable <code>path</code> string as we go.</p>`,
      sql: `WITH RECURSIVE tree(instructor_id, name, depth, path) AS (
  SELECT instructor_id, name, 0, name
  FROM instructors WHERE mentor_id IS NULL
  UNION ALL
  SELECT i.instructor_id, i.name, t.depth + 1, t.path || ' > ' || i.name
  FROM instructors i
  JOIN tree t ON i.mentor_id = t.instructor_id
)
SELECT name, depth, path FROM tree ORDER BY path;`,
      note: 'UNION ALL is safe here because a tree has no cycles. Sorting by path prints each mentor above the people they mentor.'
    },
    {
      h: 'Window functions keep the rows',
      html: `<p>GROUP BY collapses many rows into one row per group. Sometimes you want the group result <strong>next to every row</strong>: each instructor's salary and the department average on the same line. A <strong>window function</strong> does this. The <code>OVER (...)</code> clause defines the "window" of rows the function looks at.</p>
<ul><li><code>OVER ()</code>: the whole result is one window.</li><li><code>OVER (PARTITION BY dept_id)</code>: one window per department.</li></ul>
<p>Window functions are computed after WHERE, GROUP BY and HAVING, just before ORDER BY.</p>`,
      predict: {
        sql: `SELECT name, dept_id, salary,
       ROUND(AVG(salary) OVER (PARTITION BY dept_id)) AS dept_avg,

FROM instructors
WHERE dept_id IS NOT NULL
ORDER BY dept_id, salary DESC;`,
        q: '15 instructors have a department, in 7 departments. How many rows does this query return?',
        options: ['7 rows, one per department', '15 rows, one per instructor', '1 row', 'An error: salary is not in a GROUP BY'],

        why: 'There is no GROUP BY, so no rows are collapsed. The window function adds the department average to each of the 15 rows.'

    {
      h: 'ROW_NUMBER, RANK and DENSE_RANK',
      html: `<p>Ranking functions need an <code>ORDER BY</code> inside OVER. They differ only when there are <strong>ties</strong>:</p>
<table class="mini"><thead><tr><th>credits</th><th>ROW_NUMBER</th><th>RANK</th><th>DENSE_RANK</th></tr></thead><tbody>
<tr><td>4</td><td>1</td><td>1</td><td>1</td></tr><tr><td>4</td><td>2</td><td>1</td><td>1</td></tr><tr><td>3</td><td>3</td><td>3</td><td>2</td></tr><tr><td>3</td><td>4</td><td>3</td><td>2</td></tr>
</tbody></table>
<ul><li><strong>ROW_NUMBER</strong> always gives 1, 2, 3, ... Ties are broken in an unpredictable way unless you add a tiebreaker.</li><li><strong>RANK</strong> gives ties the same number, then skips (like a sports table: 1, 1, 3).</li><li><strong>DENSE_RANK</strong> gives ties the same number and does not skip (1, 1, 2).</li></ul>`,
      predict: {
        sql: `SELECT course_id, credits,

FROM courses
ORDER BY rn;`,
        q: 'Eleven courses have 4 credits and the rest have 3. What RANK do the 3-credit courses get?',
        options: ['2', '3', '11', '12'],
        answer: 3,
        why: 'Eleven rows share rank 1, so RANK skips to 12 for the next value. DENSE_RANK would give them 2.'

    },
    {
      h: 'Top-N per group',
      html: `<p>A classic interview question: "Show the best student in each section." You cannot write a window function inside WHERE, because WHERE runs before windows are computed. So rank inside a CTE, then filter outside.</p>
<p>Use <code>RANK</code> if tied students should all be shown. Use <code>ROW_NUMBER</code> if you need exactly one row per group (and add a tiebreaker).</p>`,
      sql: `WITH ranked AS (
  SELECT e.section_id, st.name, e.score,
         RANK() OVER (PARTITION BY e.section_id ORDER BY e.score DESC) AS pos
  FROM enrollments e
  JOIN students st ON st.student_id = e.student_id

SELECT section_id, name, score
FROM ranked
WHERE pos = 1
ORDER BY section_id;`

    {
      h: 'Running totals and moving averages',
      html: `<p>When a window has an ORDER BY, aggregate functions become <strong>cumulative</strong>: <code>SUM(amount) OVER (ORDER BY paid_on)</code> adds up everything from the first row to the current row.</p>
<p>A <strong>frame clause</strong> chooses exactly which rows count. <code>ROWS BETWEEN 2 PRECEDING AND CURRENT ROW</code> means "this row and the two before it", which gives a 3-row moving average.</p>
<div class="callout warn"><strong>Ties in the ORDER BY.</strong> With only ORDER BY, the default frame is <code>RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</code>. Rows with the same date are peers and are added together. Add a unique tiebreaker (like payment_id) or write <code>ROWS</code> to get a true row-by-row running total.</div>`,
      sql: `SELECT payment_id, student_id, paid_on, amount,
       SUM(amount) OVER (PARTITION BY student_id ORDER BY paid_on, payment_id) AS running_total,
       ROUND(AVG(amount) OVER (PARTITION BY student_id ORDER BY paid_on, payment_id
                               ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), 1) AS moving_avg_3
FROM payments
ORDER BY student_id, paid_on, payment_id;`
    },
    {
      h: 'LAG and LEAD: compare with the neighbour row',
      html: `<p><code>LAG(col)</code> returns the value of <code>col</code> from the <strong>previous</strong> row of the window. <code>LEAD(col)</code> returns it from the <strong>next</strong> row. The first row has no previous row, so LAG returns NULL there (or a default you give as the third argument).</p>
<p>In SQLite, <code>julianday(a) - julianday(b)</code> gives the number of days between two dates.</p>`,
      sql: `SELECT student_id, paid_on, amount,
       LAG(paid_on) OVER (PARTITION BY student_id ORDER BY paid_on) AS previous_payment,
       julianday(paid_on)
         - julianday(LAG(paid_on) OVER (PARTITION BY student_id ORDER BY paid_on)) AS days_since_previous
FROM payments
ORDER BY student_id, paid_on;`

      h: 'NTILE and percent of total',
      html: `<p><code>NTILE(4) OVER (ORDER BY x)</code> splits the rows into 4 groups of nearly equal size (quartiles) and returns the group number.</p>
<p>A percent of total divides each row's value by a window sum over everything: <code>x / SUM(x) OVER ()</code>. Window functions can even wrap an aggregate: <code>SUM(SUM(salary)) OVER ()</code> is the total of the per-group totals.</p>`,
      sql: `SELECT d.name,

       NTILE(3) OVER (ORDER BY SUM(i.salary) DESC) AS tier
FROM instructors i
JOIN departments d ON d.dept_id = i.dept_id
GROUP BY d.name
ORDER BY total_salary DESC;`

  pitfalls: [

<li><strong>RECURSIVE keyword:</strong> required in PostgreSQL and MySQL, optional in SQLite. SQL Server and Oracle do not use it: they just write <code>WITH name AS (...)</code> and detect the recursion.</li>

</ul>`,

(function () {
  // Builds a check query that describes table structure: columns, primary key membership,
  // required (NOT NULL or part of the PK), foreign keys, unique constraints and defaults.
  function schemaCheck(tables, opts) {
    opts = opts || {};
    var parts = [];
    tables.forEach(function (t) {
      parts.push(`SELECT '${t}' AS tbl, 'col' AS kind, name AS a, (pk > 0) AS b, CASE WHEN pk > 0 THEN 1 ELSE "notnull" END AS c FROM pragma_table_info('${t}')`);
      parts.push(`SELECT '${t}', 'fk', "from", lower("table"), ${opts.onDelete ? 'on_delete' : 'NULL'} FROM pragma_foreign_key_list('${t}')`);
      parts.push(`SELECT '${t}', 'unique', ii.name, NULL, NULL FROM pragma_index_list('${t}') il JOIN pragma_index_info(il.name) ii WHERE il."unique" = 1 AND il.origin <> 'pk'`);
      if (opts.defaults) parts.push(`SELECT '${t}', 'default', name, dflt_value, NULL FROM pragma_table_info('${t}') WHERE dflt_value IS NOT NULL`);
    });
    return parts.join('\nUNION ALL\n') + '\nORDER BY 1, 2, 3, 4;';
  }

(function () {
  // Builds a check query that describes table structure: columns, primary key membership,
  // required (NOT NULL or part of the PK), foreign keys, unique constraints and defaults.
  function schemaCheck(tables, opts) {
    opts = opts || {};
    var parts = [];
    tables.forEach(function (t) {
      parts.push(`SELECT '${t}' AS tbl, 'col' AS kind, name AS a, (pk > 0) AS b, CASE WHEN pk > 0 THEN 1 ELSE "notnull" END AS c FROM pragma_table_info('${t}')`);
      parts.push(`SELECT '${t}', 'fk', "from", lower("table"), ${opts.onDelete ? 'on_delete' : 'NULL'} FROM pragma_foreign_key_list('${t}')`);
      parts.push(`SELECT '${t}', 'unique', ii.name, NULL, NULL FROM pragma_index_list('${t}') il JOIN pragma_index_info(il.name) ii WHERE il."unique" = 1 AND il.origin <> 'pk'`);
    });
    return parts.join('\nUNION ALL\n') + '\nORDER BY 1, 2, 3, 4;';
  }

  function box(x, y, name, key) {
    return `<rect x="${x}" y="${y}" width="160" height="56" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="${x + 12}" y="${y + 23}" font-size="14" font-weight="700" fill="var(--ink)">${name}</text>
<text x="${x + 12}" y="${y + 43}" font-size="11" fill="var(--muted)">${key}</text>`;
  }
  function edge(d) {
    return `<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.4" marker-start="url(#d9-one)" marker-end="url(#d9-many)"/>`;
  }
  function label(x, y, t, anchor) {
    return `<text x="${x}" y="${y}" font-size="11" fill="var(--accent)" text-anchor="${anchor || 'middle'}">${t}</text>`;
  }

  var ERD = `<figure class="diagram"><svg viewBox="0 0 830 440" role="img" aria-label="Crow's foot diagram of the university database">
<defs>
<marker id="d9-one" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M4,1 V11 M8,1 V11" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker>
<marker id="d9-many" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,6 L12,0 M0,6 L12,6 M0,6 L12,12" fill="none" stroke="var(--ink)" stroke-width="1.5"/></marker>
</defs>
${edge('M220,68 H170')}${label(195, 60, 'pays')}
${edge('M430,68 H380')}${label(405, 60, 'major')}
${edge('M590,68 H640')}${label(615, 60, 'works in')}
${edge('M720,40 V16 H300 V40')}${label(510, 11, 'advises')}
${edge('M800,56 H820 V84 H800')}${label(812, 108, 'mentors')}
${edge('M510,96 V200')}${label(518, 152, 'offers', 'start')}
${edge('M720,96 V200')}${label(728, 152, 'teaches', 'start')}
${edge('M590,228 H640')}${label(615, 220, 'has')}
${edge('M720,256 V330')}${label(728, 297, 'contains', 'start')}
${edge('M300,96 V420 H720 V386')}${label(510, 414, 'enrolls')}
${edge('M480,256 V330')}${label(472, 297, 'course_id', 'end')}
${edge('M540,256 V330')}${label(548, 297, 'prereq_id', 'start')}
${box(10, 40, 'payments', 'PK payment_id')}
${box(220, 40, 'students', 'PK student_id')}
${box(430, 40, 'departments', 'PK dept_id')}
${box(640, 40, 'instructors', 'PK instructor_id')}
${box(430, 200, 'courses', 'PK course_id')}
${box(640, 200, 'sections', 'PK section_id')}
${box(430, 330, 'prereqs', 'PK (course, prereq)')}
${box(640, 330, 'enrollments', 'PK (student, section)')}
</svg></figure>
<p>Read each line from the double bar (one) to the crow's foot (many). The double bar means "exactly one" and the three-pronged foot means "many". Full crow's-foot notation also draws a circle for "zero": <code>o&lt;</code> is zero-or-many, <code>|&lt;</code> is one-or-many.</p>`;

      html: `<p>Changing a table full of data is expensive. Changing a drawing is free. So database design moves through three levels, and the ER model is the first one:</p>
<ol class="steps"><li><strong>Conceptual</strong>: what things exist and how they relate (the ER diagram). No SQL yet.</li><li><strong>Logical</strong>: tables, columns, keys, foreign keys (today's mapping step).</li><li><strong>Physical</strong>: data types, indexes, storage for one specific DBMS (Day 12).</li></ol>
<p>The ER model was introduced by Peter Chen in 1976. It has only three building blocks: <strong>entities</strong>, <strong>attributes</strong> and <strong>relationships</strong>. A good trick for finding them in a text description: nouns become entities or attributes, verbs become relationships.</p>`

<tr><td>Simple</td><td>Cannot be split</td><td>year</td><td>oval</td></tr>
<tr><td>Composite</td><td>Made of parts</td><td>address = street + city + zip</td><td>oval with sub-ovals</td></tr>

<p>Derived attributes are usually <strong>not stored</strong>. You compute them when you query, so they can never go out of date:</p>`,

<li><strong>Recursive</strong> or unary (degree 1): an entity type related to itself. Instructor <em>mentors</em> instructor; course <em>requires</em> course. Each side gets a <strong>role name</strong> (mentor, mentee).</li>
<li><strong>Ternary</strong> (degree 3): instructor teaches course in a room. Use it only when the fact really needs all three at once.</li></ul>
<p>A relationship can also have its own attributes. <code>grade</code> belongs neither to the student nor to the section; it belongs to the relationship between them.</p>`,

(function () {
  // Builds a check query that describes table structure: columns, primary key membership,
  // required (NOT NULL or part of the PK), foreign keys and unique constraints. No ORDER BY,
  // so callers can append more UNION ALL rows before ordering.
  function schemaRows(tables) {
    var parts = [];
    tables.forEach(function (t) {
      parts.push(`SELECT '${t}' AS tbl, 'col' AS kind, name AS a, (pk > 0) AS b, CASE WHEN pk > 0 THEN 1 ELSE "notnull" END AS c FROM pragma_table_info('${t}')`);
      parts.push(`SELECT '${t}', 'fk', "from", lower("table"), NULL FROM pragma_foreign_key_list('${t}')`);
      parts.push(`SELECT '${t}', 'unique', ii.name, NULL, NULL FROM pragma_index_list('${t}') il JOIN pragma_index_info(il.name) ii WHERE il."unique" = 1 AND il.origin <> 'pk'`);
    });
    return parts.join('\nUNION ALL\n');
  }

LAB.days.push({
  n: 10,
  week: 2,
  tag: 'NORMAL',
  title: 'Normalization',
  hours: 3,
  goals: [
    'Recognize update, insertion and deletion anomalies in a badly designed table',
    'Compute attribute closures and find every candidate key of a relation',
    'Decide whether a relation is in 1NF, 2NF, 3NF or BCNF, and decompose it',
    'Check that a decomposition is lossless and dependency-preserving'
  ],
  lesson: [
    {
      h: 'The problem: one big table',
      html: `<p>Imagine a shop that keeps everything in one spreadsheet-like table, one row per product per order. Run the example and look at how often "Karim Nasser, Amman" and "Notebook, 2.5" are repeated. Repetition is not only wasted space. It causes three <strong>anomalies</strong>:</p>
<ul><li><strong>Update anomaly</strong>: Karim moves to Irbid. You must change 4 rows. Miss one and the database contradicts itself.</li>
<li><strong>Insertion anomaly</strong>: you cannot add a new product until somebody orders it, because order_id is part of the key.</li>
<li><strong>Deletion anomaly</strong>: delete order 5 and you also lose the only record that customer Ravi Patel exists.</li></ul>
<p><strong>Normalization</strong> is a step-by-step method to split such a table into smaller ones so that every fact is stored exactly once.</p>`,
      sql: FLAT + `
SELECT * FROM orders_flat ORDER BY order_id, product_id;`
    },
    {
      h: 'Functional dependencies',
      html: `<p>A <strong>functional dependency</strong> (FD) <code>X → Y</code> means: two rows that agree on X must agree on Y. "X determines Y." In the shop table:</p>
<ul><li><code>customer_id → customer_name, customer_city</code></li>
<li><code>product_id → product_name, unit_price</code></li>
<li><code>order_id → order_date, customer_id</code></li>
<li><code>order_id, product_id → qty</code></li></ul>
<p>FDs come from the <em>meaning</em> of the data (business rules), not from the rows you happen to have. But data can <em>disprove</em> an FD. This query pattern finds every X value that breaks <code>X → Y</code>. It is the same pattern you will use in the exercises.</p>`,
      sql: `-- Does course_id → instructor_id hold in sections? (Is a course always taught by the same person?)
SELECT course_id, COUNT(DISTINCT instructor_id) AS different_instructors
FROM sections
GROUP BY course_id
HAVING COUNT(DISTINCT instructor_id) > 1;`,
      note: 'Any row returned is a counterexample, so the FD does not hold. Good news for the design: instructor_id belongs in sections, not in courses.'
    },
    {
      h: 'Armstrong\'s axioms',
      html: `<p>From some FDs you can derive others. Three rules (Armstrong's axioms) are enough to derive everything:</p>
<table class="mini"><thead><tr><th>Rule</th><th>If</th><th>Then</th></tr></thead><tbody>
<tr><td>Reflexivity</td><td>Y ⊆ X</td><td>X → Y (trivial FD)</td></tr>
<tr><td>Augmentation</td><td>X → Y</td><td>XZ → YZ</td></tr>
<tr><td>Transitivity</td><td>X → Y and Y → Z</td><td>X → Z</td></tr>
</tbody></table>
<p>Useful rules that follow from them: <strong>union</strong> (X → Y and X → Z give X → YZ), <strong>decomposition</strong> (X → YZ gives X → Y and X → Z) and <strong>pseudotransitivity</strong> (X → Y and WY → Z give WX → Z).</p>`
    },
    {
      h: 'Attribute closure X⁺, step by step',
      html: `<p>The <strong>closure</strong> X⁺ is the set of all attributes that X determines. It is the most important tool in this topic: it tests keys, tests FDs and checks normal forms. The algorithm:</p>
<ol class="steps"><li>Start with result = X.</li><li>Look for an FD A → B where all of A is already in result. Add B to result.</li><li>Repeat step 2 until nothing changes.</li></ol>
<p><strong>Worked example.</strong> R(A, B, C, D, E) with F = { A → B, B → C, CD → E }. Compute {A, D}⁺:</p>
<table class="mini"><thead><tr><th>Step</th><th>FD used</th><th>result</th></tr></thead><tbody>
<tr><td>start</td><td>—</td><td>{A, D}</td></tr>
<tr><td>1</td><td>A → B</td><td>{A, B, D}</td></tr>
<tr><td>2</td><td>B → C</td><td>{A, B, C, D}</td></tr>
<tr><td>3</td><td>CD → E</td><td>{A, B, C, D, E}</td></tr>
</tbody></table>
<p>{A, D}⁺ contains every attribute of R, so {A, D} is a <strong>superkey</strong>. And {A}⁺ = {A, B, C}, {D}⁺ = {D}: neither alone is enough, so {A, D} is minimal, which makes it a <strong>candidate key</strong>.</p>
<p>To test whether an FD X → Y follows from F, compute X⁺ and check that Y is inside it.</p>`
    },
    {
      h: 'Finding all candidate keys quickly',
      html: `<p>Sort the attributes into three groups using the FDs:</p>
<ul><li><strong>Never on a right side</strong>: must be in <em>every</em> key (nothing else can determine them).</li>
<li><strong>Only on right sides</strong>: never in any key (something else determines them).</li>
<li><strong>On both sides</strong>: maybe.</li></ul>
<p>Start with the "must" group. If its closure is all of R, it is the only candidate key. Otherwise add "maybe" attributes one at a time, then two at a time, and keep only the minimal sets whose closure is R.</p>
<p>Example: R(A, B, C, D) with F = { AB → C, C → D, D → A }. B is never on a right side, so B is in every key. {B}⁺ = {B}. Try adding one: {A,B}⁺ = ABCD ✓, {B,C}⁺ = BCDA ✓, {B,D}⁺ = BDA, then AB → C gives ABCD ✓. Candidate keys: AB, BC, BD.</p>`,
      predict: {
        q: 'R(A, B, C, D, E) with F = { A → C, B → D, AB → E }. What is the only candidate key?',
        options: ['{A}', '{A, B}', '{A, B, E}', '{C, D, E}'],
        answer: 1,
        why: 'A and B never appear on a right side, so both are in every key. {A,B}⁺ = {A,B,C,D,E} = all of R, so AB is the only candidate key. Adding E would make a superkey that is not minimal.'
      }
    },
    {
      h: 'First normal form (1NF)',
      html: `<p>A table is in <strong>1NF</strong> when every cell holds one <strong>atomic</strong> value: no lists, no repeating groups (phone1, phone2, phone3) and no nested tables. Every relational table you create with SQL already has the "no nested tables" part; the lists are what you must avoid.</p>
<p>Why it matters: with a list in a cell you cannot index it, join on it or count it properly, and searching needs fragile tricks like <code>LIKE '%SQL%'</code> (which also matches "NoSQL"). The fix is the same as for a multivalued attribute: a separate table with one row per value.</p>`,
      sql: `CREATE TABLE skills_bad (student_id INTEGER PRIMARY KEY, skills TEXT);
INSERT INTO skills_bad VALUES (1001, 'SQL,Python'), (1002, 'NoSQL'), (1003, 'Excel,SQL');

-- Who knows SQL? The fragile way finds a wrong answer:
SELECT student_id, skills FROM skills_bad WHERE skills LIKE '%SQL%';`,
      note: 'Student 1002 knows NoSQL, not SQL, but is returned. In a 1NF table (student_id, skill) the query is simply WHERE skill = \'SQL\'.'
    },
    {
      h: 'Second normal form (2NF)',
      html: `<p>A table is in <strong>2NF</strong> when it is in 1NF and no non-key attribute depends on <strong>only part</strong> of a candidate key. Such a dependency is called a <strong>partial dependency</strong>.</p>
<p>In <code>orders_flat</code> the key is (order_id, product_id). But <code>product_name</code> depends only on product_id, and <code>order_date</code> depends only on order_id. Both are partial dependencies, so the table is not in 2NF.</p>
<p>Fix: move each partial dependency into its own table, keyed by the part it depends on: <code>products(product_id, name, unit_price)</code>, <code>orders(order_id, order_date, customer_id, ...)</code>, and keep <code>order_items(order_id, product_id, qty)</code>.</p>
<div class="callout">A table whose primary key is a single column is automatically in 2NF: there is no "part" of the key to depend on.</div>`
    },
    {
      h: 'Third normal form (3NF)',
      html: `<p>A table is in <strong>3NF</strong> when it is in 2NF and no non-key attribute depends on another non-key attribute. That chain, key → A → B, is a <strong>transitive dependency</strong>.</p>
<p>After the 2NF step, <code>orders(order_id, order_date, customer_id, customer_name, customer_city)</code> still has one: order_id → customer_id → customer_city. Move the customer facts out: <code>customers(customer_id, name, city)</code>, and keep only <code>customer_id</code> in orders.</p>
<p>The formal definition (use this one in exams): for every non-trivial FD X → A, either <strong>X is a superkey</strong>, or <strong>A is a prime attribute</strong> (A is part of some candidate key).</p>
<p>A short way to remember 1NF to 3NF: every non-key attribute depends on "the key (1NF), the whole key (2NF), and nothing but the key (3NF)".</p>`,
      predict: {
        q: 'students(student_id, name, dept_id, dept_building). Key: student_id. Which normal form does it break first?',
        options: ['1NF', '2NF', '3NF', 'None, it is in BCNF'],
        answer: 2,
        why: 'The key is a single column, so 2NF holds. But student_id → dept_id → dept_building is transitive: dept_building depends on a non-key attribute. That breaks 3NF. Our real schema avoids it by keeping building in departments.'
      }
    },
    {
      h: 'Boyce–Codd normal form (BCNF)',
      html: `<p><strong>BCNF</strong> is stricter: for every non-trivial FD X → A, <strong>X must be a superkey</strong>. No exception for prime attributes. In words: every determinant is a key.</p>
<p>The classic case that is in 3NF but not BCNF: <code>tutoring(student, course, tutor)</code>. Each tutor teaches one course, and a student has one tutor per course.</p>
<ul><li>FDs: {student, course} → tutor, and tutor → course</li>
<li>Candidate keys: {student, course} and {student, tutor}</li>
<li>tutor → course: tutor is not a superkey ✗ for BCNF. But course is prime (part of a key), so 3NF is satisfied ✓.</li></ul>
<p>Decompose on the violating FD: <code>tutor_course(tutor, course)</code> and <code>student_tutor(student, tutor)</code>. The result is BCNF and lossless, but the FD {student, course} → tutor can no longer be checked inside one table. BCNF can cost dependency preservation; 3NF never does.</p>`,

        why: 'C → B: C is not a superkey, so it is not BCNF. But B is prime (it is in key AB), so the 3NF condition holds. Same shape as the tutoring example.'
      }
    },
    {
      h: 'Good decompositions: lossless and dependency-preserving',
      html: `<p>Splitting a table is only correct if you can get the original back with a join. A decomposition of R into R1 and R2 is <strong>lossless</strong> when the shared columns are a key of R1 or of R2 (R1 ∩ R2 → R1 or R1 ∩ R2 → R2).</p>
<p>A <strong>lossy</strong> split does not lose rows. It <em>adds</em> fake ones, called spurious tuples. The example splits students on <code>city</code>, which is not a key of either part, and joins them back.</p>
<div class="callout"><strong>When to stop.</strong> In practice, design to 3NF (or BCNF when it costs nothing). 4NF and 5NF exist but rarely matter in daily work. Teams sometimes <strong>denormalize</strong> on purpose, storing a copy (a total, a name) to speed up a hot query, especially in reporting databases and star schemas. The price: something must keep the copies in sync. Normalize first; denormalize only with a measured reason.</div>`,
      sql: `WITH a AS (SELECT DISTINCT name, city FROM students WHERE city IS NOT NULL),
