LAB.days.push({
  n: 11,
  week: 2,
  tag: 'ACID',
  title: 'Transactions and Concurrency',
  hours: 3,
  goals: [
    'Explain the four ACID properties with the bank-transfer example',
    'Use BEGIN, COMMIT, ROLLBACK and SAVEPOINT to make several changes all-or-nothing',
    'Name the five classic concurrency anomalies and the isolation level that prevents each',
    'Test a schedule for conflict serializability with a precedence graph',
    'Describe how locking (2PL), MVCC and write-ahead logging work'
  ],
  lesson: [
    {
      h: 'What a transaction is: ACID',
      html: `<p>A <strong>transaction</strong> is a group of SQL statements that the database treats as <em>one unit of work</em>. Either every statement in the group takes effect, or none of them do.</p>
<p>The classic example is a bank transfer of 100 from account A to account B. It needs two statements:</p>
<pre class="code">UPDATE accounts SET balance = balance - 100 WHERE id = 'A';
UPDATE accounts SET balance = balance + 100 WHERE id = 'B';</pre>
<p>If the power fails after the first statement, the money has left A but never arrived at B. 100 has disappeared. A transaction makes this impossible: after a crash the database sees that the transfer never finished and removes the half-done change. A transaction gives four promises, known as <strong>ACID</strong>:</p>
<table class="mini"><thead><tr><th>Letter</th><th>Property</th><th>Meaning in the transfer example</th><th>Who provides it</th></tr></thead><tbody>
<tr><td><strong>A</strong></td><td>Atomicity</td><td>Both updates happen, or neither happens.</td><td>Undo log / rollback</td></tr>
<tr><td><strong>C</strong></td><td>Consistency</td><td>Every rule still holds after the transaction: no negative balance if there is a CHECK, total money unchanged.</td><td>Constraints + correct application logic</td></tr>
<tr><td><strong>I</strong></td><td>Isolation</td><td>Another user running at the same time never sees the money "in the air" (taken from A but not yet given to B).</td><td>Locks or MVCC</td></tr>
<tr><td><strong>D</strong></td><td>Durability</td><td>Once the bank says "transfer complete", the change survives a crash one millisecond later.</td><td>Write-ahead log on disk</td></tr>
</tbody></table>
<div class="callout"><strong>Exam tip.</strong> Consistency is the only property the database cannot give alone. If your code moves 100 out of A and 90 into B, every constraint may still pass, but the data is wrong. Atomicity, isolation and durability are the tools; consistency is the goal.</div>`
    },
    {
      h: 'BEGIN, COMMIT and ROLLBACK',
      html: `<p><code>BEGIN</code> starts a transaction. <code>COMMIT</code> makes all its changes permanent. <code>ROLLBACK</code> throws all of them away. Without BEGIN, most databases run in <strong>autocommit</strong> mode: every single statement is its own transaction.</p>
<p>Run the example below. The two departments get a budget change inside a transaction, then we change our mind and roll back. The final SELECT shows the original budgets.</p>`,
      sql: `BEGIN;
UPDATE departments SET budget = budget - 50000 WHERE dept_id = 1;
UPDATE departments SET budget = budget + 50000 WHERE dept_id = 8;
SELECT dept_id, name, budget FROM departments WHERE dept_id IN (1, 8);
ROLLBACK;
SELECT dept_id, name, budget FROM departments WHERE dept_id IN (1, 8);`,
      note: 'The first result shows the changed budgets (visible inside the transaction). The second result, after ROLLBACK, shows the original values.'
    },
    {
      h: 'SAVEPOINT: undo part of a transaction',
      html: `<p>A <strong>savepoint</strong> is a named point inside a transaction. <code>ROLLBACK TO name</code> undoes only the work done after that point; the transaction stays open and you can continue. This is useful in long jobs: if one step fails, you undo that step and not the whole job.</p>`,
      sql: `BEGIN;
UPDATE instructors SET salary = salary + 1000 WHERE dept_id = 1;
SAVEPOINT before_math;
UPDATE instructors SET salary = salary + 99999 WHERE dept_id = 2;  -- a mistake
ROLLBACK TO before_math;
COMMIT;
SELECT name, dept_id, salary FROM instructors WHERE dept_id IN (1, 2) ORDER BY dept_id, name;`,
      note: 'Computer Science (dept 1) keeps its raise. The wrong Mathematics raise was undone by ROLLBACK TO.',
      predict: {
        sql: `BEGIN;
UPDATE departments SET budget = 0 WHERE dept_id = 6;
SAVEPOINT s1;
UPDATE departments SET budget = 1 WHERE dept_id = 6;
ROLLBACK TO s1;
COMMIT;
SELECT budget FROM departments WHERE dept_id = 6;`,
        q: 'What budget does History (dept 6) have at the end? (It started at 210000.)',
        options: ['210000', '0', '1', 'NULL'],
        answer: 1,
        why: 'ROLLBACK TO s1 removes only the change made after the savepoint (budget = 1). The change before the savepoint (budget = 0) is kept and then committed.'
      }
    },
    {
      h: 'Concurrency anomalies, part 1: reading problems',
      html: `<p>Many users run transactions at the same time. Without isolation, one transaction can see another one in a half-finished state. Read each timeline from top to bottom; T1 and T2 are two users.</p>
<p><strong>Dirty read</strong>: reading data that another transaction has not committed yet.</p>
<table class="mini"><thead><tr><th>Step</th><th>T1</th><th>T2</th></tr></thead><tbody>
<tr><td>1</td><td>UPDATE balance of A to 0</td><td></td></tr>
<tr><td>2</td><td></td><td>SELECT balance of A → <strong>0</strong></td></tr>
<tr><td>3</td><td>ROLLBACK (A is back to 500)</td><td></td></tr>
<tr><td>4</td><td></td><td>T2 acted on a value that never officially existed</td></tr>
</tbody></table>
<p><strong>Non-repeatable read</strong>: you read the same row twice and get different values, because someone committed a change in between.</p>
<table class="mini"><thead><tr><th>Step</th><th>T1</th><th>T2</th></tr></thead><tbody>
<tr><td>1</td><td>SELECT balance of A → 500</td><td></td></tr>
<tr><td>2</td><td></td><td>UPDATE A to 300; COMMIT</td></tr>
<tr><td>3</td><td>SELECT balance of A → <strong>300</strong></td><td></td></tr>
</tbody></table>
<p><strong>Phantom read</strong>: you run the same <em>search</em> twice and new rows appear (or disappear), because someone inserted or deleted matching rows.</p>
<table class="mini"><thead><tr><th>Step</th><th>T1</th><th>T2</th></tr></thead><tbody>
<tr><td>1</td><td>SELECT COUNT(*) FROM students WHERE year = 1 → 9</td><td></td></tr>
<tr><td>2</td><td></td><td>INSERT a new first-year student; COMMIT</td></tr>
<tr><td>3</td><td>same SELECT → <strong>10</strong></td><td></td></tr>
</tbody></table>`
    },
    {
      h: 'Concurrency anomalies, part 2: writing problems',
      html: `<p><strong>Lost update</strong>: two transactions read the same value, both compute a new value from it, and the second write overwrites the first.</p>
<table class="mini"><thead><tr><th>Step</th><th>T1 (deposit 100)</th><th>T2 (deposit 50)</th></tr></thead><tbody>
<tr><td>1</td><td>read balance → 500</td><td></td></tr>
<tr><td>2</td><td></td><td>read balance → 500</td></tr>
<tr><td>3</td><td>write 600; COMMIT</td><td></td></tr>
<tr><td>4</td><td></td><td>write 550; COMMIT</td></tr>
<tr><td>5</td><td colspan="2">Final balance 550. The deposit of 100 is lost; it should be 650.</td></tr>
</tbody></table>
<p>The fix in SQL is to let the database do the arithmetic in one statement (<code>SET balance = balance + 100</code>) or to lock the row when reading (<code>SELECT ... FOR UPDATE</code> in PostgreSQL, MySQL, Oracle).</p>
<p><strong>Write skew</strong>: two transactions read the same data, each checks a rule, then each updates a <em>different</em> row. Each change is fine alone, together they break the rule.</p>
<table class="mini"><thead><tr><th>Step</th><th>T1 (Dr. X goes home)</th><th>T2 (Dr. Y goes home)</th></tr></thead><tbody>
<tr><td>1</td><td>count doctors on call → 2, OK to leave</td><td></td></tr>
<tr><td>2</td><td></td><td>count doctors on call → 2, OK to leave</td></tr>
<tr><td>3</td><td>set X off call; COMMIT</td><td></td></tr>
<tr><td>4</td><td></td><td>set Y off call; COMMIT</td></tr>
<tr><td>5</td><td colspan="2">Rule "at least one doctor on call" is broken: zero doctors.</td></tr>
</tbody></table>`
    },
    {
      h: 'Isolation levels',
      html: `<p>Full isolation costs speed, so the SQL standard defines four levels. Each level forbids more anomalies than the one above it.</p>
<table class="mini"><thead><tr><th>Level</th><th>Dirty read</th><th>Non-repeatable read</th><th>Phantom</th></tr></thead><tbody>
<tr><td>READ UNCOMMITTED</td><td>possible</td><td>possible</td><td>possible</td></tr>
<tr><td>READ COMMITTED</td><td>prevented</td><td>possible</td><td>possible</td></tr>
<tr><td>REPEATABLE READ</td><td>prevented</td><td>prevented</td><td>possible</td></tr>
<tr><td>SERIALIZABLE</td><td>prevented</td><td>prevented</td><td>prevented</td></tr>
</tbody></table>
<p><strong>SERIALIZABLE</strong> means: the result is the same as if the transactions had run one after another in some order. It also prevents lost updates and write skew.</p>
<div class="callout"><strong>Defaults to remember.</strong> PostgreSQL, Oracle and SQL Server default to READ COMMITTED. MySQL InnoDB defaults to REPEATABLE READ. SQLite is SERIALIZABLE, because only one writer can work at a time.</div>
<pre class="code">-- PostgreSQL / MySQL / SQL Server
SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;</pre>`,
      predict: {
        q: 'A report reads the same account twice in one transaction and must get the same value both times. Phantoms do not matter. What is the weakest level that is enough?',
        options: ['READ UNCOMMITTED', 'READ COMMITTED', 'REPEATABLE READ', 'SERIALIZABLE'],
        answer: 2,
        why: 'Reading the same row twice and getting the same value is exactly "no non-repeatable reads". REPEATABLE READ is the first level that guarantees it.'
      }
    },
    {
      h: 'Locks and two-phase locking',
      html: `<p>Many databases implement isolation with <strong>locks</strong>:</p>
<ul><li><strong>Shared lock (S)</strong>: taken to read. Many transactions can hold S on the same item.</li><li><strong>Exclusive lock (X)</strong>: taken to write. Only one transaction can hold it, and nobody else can hold S or X on that item.</li></ul>
<table class="mini"><thead><tr><th>Held \\ Requested</th><th>S</th><th>X</th></tr></thead><tbody><tr><td>S</td><td>granted</td><td>wait</td></tr><tr><td>X</td><td>wait</td><td>wait</td></tr></tbody></table>
<p><strong>Two-phase locking (2PL)</strong> has one rule: a transaction first only <em>acquires</em> locks (growing phase), and after it releases its first lock it may never acquire another one (shrinking phase). 2PL guarantees conflict-serializable schedules.</p>
<p><strong>Strict 2PL</strong> keeps all exclusive locks until COMMIT or ROLLBACK. This also prevents dirty reads and cascading rollbacks, so real systems use it.</p>
<p><strong>Deadlock</strong>: T1 holds a lock on A and waits for B; T2 holds B and waits for A. Neither can continue. Databases detect the cycle in a <em>wait-for graph</em> and abort one transaction (the victim), which must retry. Applications should be ready to retry, and should lock rows in the same order everywhere to make deadlocks rare.</p>`
    },
    {
      h: 'MVCC: readers do not block writers',
      html: `<p>PostgreSQL, Oracle, MySQL InnoDB and SQL Server (with snapshot isolation) use <strong>multi-version concurrency control (MVCC)</strong>. An UPDATE does not overwrite the row; it creates a new <em>version</em> and keeps the old one for a while.</p>
<p>Each transaction reads from a <strong>snapshot</strong>: the versions that were committed when its snapshot was taken. So a long report reads old versions while writers create new ones, and nobody waits. Writers still conflict with writers: two transactions updating the same row cannot both win.</p>
<div class="callout">Under MVCC, REPEATABLE READ usually means "one snapshot for the whole transaction" (often called <em>snapshot isolation</em>). It prevents phantoms in PostgreSQL, but it still allows <strong>write skew</strong>. Only SERIALIZABLE prevents write skew.</div>`
    },

      h: 'Schedules and conflict serializability',
      html: `<p>A <strong>schedule</strong> is the order in which the operations of several transactions run. We write R1(A) for "T1 reads A" and W2(B) for "T2 writes B".</p>
<ul><li><strong>Serial schedule</strong>: one transaction runs completely, then the next. Always correct, but slow.</li><li><strong>Serializable schedule</strong>: interleaved, but with the same effect as some serial schedule.</li></ul>
<p>Two operations <strong>conflict</strong> when they (1) belong to different transactions, (2) touch the same item, and (3) at least one is a write. So R–W, W–R and W–W conflict; R–R does not.</p>
<p><strong>The precedence-graph test</strong> (an exam favorite):</p>
<ol class="steps"><li>Draw one node per transaction.</li><li>Go through the schedule. For every pair of conflicting operations where Ti's operation comes first, draw an edge Ti → Tj.</li><li>If the graph has <strong>no cycle</strong>, the schedule is conflict-serializable. A topological order of the graph gives the equivalent serial order.</li><li>If there is a cycle, it is not conflict-serializable.</li></ol>
<p><strong>Worked example.</strong> S = R1(A), R2(A), W1(A), W2(A)</p>
<ul><li>R1(A) before W2(A): edge T1 → T2</li><li>R2(A) before W1(A): edge T2 → T1</li><li>W1(A) before W2(A): edge T1 → T2</li></ul>
<figure class="diagram"><svg viewBox="0 0 300 90" width="300" height="90" role="img" aria-label="Precedence graph with a cycle between T1 and T2"><defs><marker id="ar11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker></defs><circle cx="60" cy="45" r="24" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/><text x="60" y="50" text-anchor="middle" font-size="15" fill="var(--ink)">T1</text><circle cx="240" cy="45" r="24" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/><text x="240" y="50" text-anchor="middle" font-size="15" fill="var(--ink)">T2</text><path d="M84,38 Q150,8 216,38" fill="none" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#ar11)"/><path d="M216,52 Q150,82 84,52" fill="none" stroke="var(--bad)" stroke-width="1.6" marker-end="url(#ar11)"/><text x="150" y="16" text-anchor="middle" font-size="11" fill="var(--muted)">R1(A)…W2(A)</text><text x="150" y="86" text-anchor="middle" font-size="11" fill="var(--bad)">R2(A)…W1(A)</text></svg><figcaption>A cycle T1 → T2 → T1, so S is not conflict-serializable. This is the lost-update schedule.</figcaption></figure>`,

        why: 'Every conflict on A and on B has T1\'s operation first, so all edges go T1 → T2. No cycle, and the serial order is T1, T2.'
      }
    },
    {
      h: 'Durability: write-ahead logging and recovery',
      html: `<p>Writing changed data pages to disk on every COMMIT would be slow, because changes are spread all over the file. Instead, databases use a <strong>write-ahead log (WAL)</strong>:</p>
<ol class="steps"><li>Every change is first written as a small record to an append-only log file.</li><li>At COMMIT, the log records are forced to disk (<code>fsync</code>). Only then does the database answer "committed".</li><li>The changed data pages are written to disk later, in the background (a <em>checkpoint</em>).</li></ol>
<p>The rule: <strong>the log record must reach disk before the data page it describes</strong>. After a crash, recovery reads the log:</p>
<ul><li><strong>REDO</strong> changes of committed transactions whose pages never reached disk (durability).</li><li><strong>UNDO</strong> changes of transactions that never committed (atomicity).</li></ul>
<p>The well-known algorithm that does this is called <strong>ARIES</strong> (analysis, redo, undo).</p>`

    {
      h: 'Where rows really live: pages',
      html: `<p>A table is stored on disk as a file of fixed-size <strong>pages</strong> (also called blocks): 4 KB in SQLite by default, 8 KB in PostgreSQL, 16 KB in MySQL InnoDB. Each page holds many rows. The disk and the operating system always read whole pages, never single rows.</p>
<p>So the cost of a query is mostly <strong>how many pages it must read</strong>. If the table has 1,000,000 rows in 20,000 pages and you ask for one student by email, a database without help must read all 20,000 pages and test every row. This is a <strong>full table scan</strong>.</p>
<p>An <strong>index</strong> is a separate, sorted structure that maps a column value to the location of its rows. Like the index at the back of a book: you find the word, then go straight to the page.</p>`
    },
    {
      h: 'The B+ tree',
      html: `<p>Almost every relational database uses the <strong>B+ tree</strong> as its default index. Its properties:</p>
<ul><li>All keys are kept in <strong>sorted order</strong>.</li><li>Inner nodes only hold separator keys and pointers to children.</li><li>All values (row pointers) are in the <strong>leaf nodes</strong>, which are all at the same depth.</li><li>Leaves are linked left to right, so a range like <code>salary BETWEEN 70000 AND 90000</code> finds the first leaf and then walks along.</li></ul>
<figure class="diagram"><svg viewBox="0 0 560 190" width="560" height="190" role="img" aria-label="A B+ tree with a root, two inner nodes and five linked leaves">

</svg><figcaption>A small B+ tree on instructors.salary (simplified: real leaves also store row ids, and a real tree has a few children per separator key).</figcaption></figure>`
    },
    {
      h: 'Why B+ trees are shallow',
      html: `<p>A node is one page. With 8 KB pages and small keys, one inner node can point to several hundred children. This number is the <strong>fan-out</strong>. With fan-out 500:</p>
<table class="mini"><thead><tr><th>Levels</th><th>Rows that can be indexed</th></tr></thead><tbody>
<tr><td>2</td><td>500 × 500 = 250,000</td></tr><tr><td>3</td><td>125,000,000</td></tr><tr><td>4</td><td>62,500,000,000</td></tr></tbody></table>
<p>The height grows like <strong>log<sub>fan-out</sub>(N)</strong>. So finding one row among 100 million needs about 3–4 page reads instead of hundreds of thousands. The top levels are also almost always in memory, so in practice it is often a single disk read.</p>
<div class="callout"><strong>Other index types.</strong> A <em>hash index</em> computes a hash of the key and jumps to a bucket. It is great for <code>=</code> but useless for ranges (<code>&lt;</code>, <code>BETWEEN</code>) and for ORDER BY, because hashing destroys the order. PostgreSQL also has GIN (full text, arrays, JSON), GiST (geometry) and BRIN (huge time-ordered tables).</div>`
    },
    {
      h: 'Reading EXPLAIN QUERY PLAN',
      html: `<p>Put <code>EXPLAIN QUERY PLAN</code> before any query and SQLite tells you how it will run it, without running it. Look at the <code>detail</code> column:</p>
<ul><li><code>SCAN students</code>: full table scan, every row is read.</li><li><code>SEARCH students USING INDEX idx_x (city=?)</code>: the index is used to jump to matching rows.</li><li><code>SEARCH ... USING COVERING INDEX</code>: the index alone holds every column the query needs; the table is not touched at all.</li><li><code>USING INTEGER PRIMARY KEY</code>: lookup by the row id, the fastest possible access.</li></ul>
<p>Run this example. The first plan is a SCAN. Then we create an index and the same query becomes a SEARCH.</p>`,
      sql: `EXPLAIN QUERY PLAN SELECT name FROM students WHERE city = 'Cairo';
CREATE INDEX idx_students_city ON students(city);
EXPLAIN QUERY PLAN SELECT name FROM students WHERE city = 'Cairo';`,
      note: 'Only the last result is shown in full. Run the first line alone to see the SCAN plan.'
    },
    {
      h: 'Composite indexes and the leftmost-prefix rule',
      html: `<p>An index can contain several columns: <code>CREATE INDEX idx ON payments(student_id, paid_on)</code>. Entries are sorted by <code>student_id</code> first, and by <code>paid_on</code> inside each student. Think of a phone book sorted by (last name, first name).</p>
<p>The <strong>leftmost-prefix rule</strong>: the index can be used for searches on</p>
<ul><li><code>student_id</code> alone ✓</li><li><code>student_id</code> and <code>paid_on</code> ✓</li><li><code>paid_on</code> alone ✗ (like searching a phone book by first name only)</li></ul>
<p>Column order matters: put columns tested with <code>=</code> first and the range column (<code>&lt;</code>, <code>&gt;</code>, BETWEEN) last.</p>`,
      sql: `CREATE INDEX idx_pay_student_date ON payments(student_id, paid_on);
EXPLAIN QUERY PLAN
SELECT student_id, paid_on FROM payments
WHERE student_id = 1005 AND paid_on >= '2026-01-01';`,
      predict: {
        q: 'With only the index payments(student_id, paid_on), which WHERE clause can use it to SEARCH?',
        options: ["WHERE paid_on = '2026-03-01'", "WHERE method = 'cash'", 'WHERE student_id = 1010', "WHERE paid_on > '2026-01-01' OR method = 'bank'"],
        answer: 2,
        why: 'student_id is the leftmost column of the index. paid_on alone is not a prefix, and method is not in the index.'
      }
    },
    {
      h: 'Covering indexes',
      html: `<p>A normal index lookup is two steps: find the entry in the index, then fetch the full row from the table. If the index already contains <strong>every column the query uses</strong> (in SELECT, WHERE, ORDER BY), the second step disappears. That index is <strong>covering</strong> for that query.</p>
<p>In the previous example the query only used <code>student_id</code> and <code>paid_on</code>, so the plan said <code>USING COVERING INDEX</code>. If you add <code>amount</code> to the SELECT list, the plan goes back to <code>USING INDEX</code> because the table must be read too.</p>
<p>SQL Server and PostgreSQL let you add non-key columns just for covering: <code>CREATE INDEX ... ON payments(student_id) INCLUDE (amount)</code>.</p>`
    },
    {
      h: 'Selectivity: when an index does not help',
      html: `<p><strong>Selectivity</strong> is the fraction of rows a condition returns. An index pays off when the condition is <em>selective</em> (returns few rows): <code>email = ...</code> returns 1 row out of 40.</p>
<p>A condition like <code>year = 2</code> may return 25% of the table, and <code>method = 'card'</code> may return half of it. Jumping through the index for each of those rows can be slower than one straight scan. The <strong>query optimizer</strong> estimates this using statistics (number of distinct values, histograms; run <code>ANALYZE</code> to refresh them) and may decide to ignore your index. That is correct behavior, not a bug.</p>
<p>Rule of thumb: an index on a column with very few distinct values (gender, a boolean, a status with 3 values) rarely helps by itself.</p>`,
      sql: `SELECT COUNT(*) AS total_rows,
       COUNT(DISTINCT email) AS distinct_email,
       COUNT(DISTINCT year) AS distinct_year,
       COUNT(DISTINCT city) AS distinct_city
FROM students;`
    },
    {
      h: 'Sargable predicates',
      html: `<p>A condition is <strong>sargable</strong> (Search ARGument ABLE) when the database can use an index for it. The rule: <strong>leave the indexed column alone</strong> on one side of the comparison.</p>
<table class="mini"><thead><tr><th>Not sargable (scan)</th><th>Sargable rewrite (can SEARCH)</th></tr></thead><tbody>
<tr><td><code>WHERE substr(hire_date,1,4) = '2017'</code></td><td><code>WHERE hire_date &gt;= '2017-01-01' AND hire_date &lt; '2018-01-01'</code></td></tr>
<tr><td><code>WHERE salary * 12 &gt; 1000000</code></td><td><code>WHERE salary &gt; 1000000 / 12.0</code></td></tr>
<tr><td><code>WHERE year + 1 = 3</code></td><td><code>WHERE year = 2</code></td></tr>
<tr><td><code>WHERE name LIKE '%Haddad'</code></td><td>No simple rewrite: a leading wildcard cannot use a B+ tree. Use full-text search.</td></tr>
</tbody></table>
<p>If you must filter on an expression, many databases let you index the expression itself: <code>CREATE INDEX idx ON students(lower(city))</code>. The query must use exactly the same expression.</p>`,
      predict: {
        q: 'There is an index on instructors(hire_date). Which filter can use it?',
        options: ["WHERE substr(hire_date, 1, 4) = '2020'", "WHERE hire_date LIKE '%2020%'", "WHERE hire_date BETWEEN '2020-01-01' AND '2020-12-31'", "WHERE date(hire_date, '+1 year') > '2021-01-01'"],
        answer: 2,
        why: 'Only the BETWEEN version leaves hire_date untouched. The other three wrap the column in a function or start with a wildcard.'
      }
    },
    {
      h: 'The cost of indexes',
      html: `<p>Indexes are not free:</p>
<ul><li>Every <code>INSERT</code> and <code>DELETE</code> must also update every index on the table; an <code>UPDATE</code> of an indexed column must too. A table with 10 indexes makes writes much slower.</li><li>Indexes use disk space and memory (cache).</li><li>Unused indexes still pay these costs.</li></ul>
<p><strong>Good default choices:</strong> primary keys (created automatically), foreign key columns that you join on (<code>enrollments.section_id</code>, <code>sections.course_id</code>), and columns that appear in frequent, selective WHERE clauses. Then measure with EXPLAIN, not with guesses.</p>
<p><strong>Partial index</strong> (PostgreSQL, SQLite): index only some rows, e.g. <code>CREATE INDEX idx ON enrollments(section_id) WHERE grade IS NULL</code> keeps a small index of in-progress enrollments.</p>`
    },
    {
      h: 'Clustered vs non-clustered',
      html: `<p>In a <strong>clustered index</strong> the table rows themselves are stored inside the B+ tree leaves, in key order. A table can have only one, because rows can be physically sorted only one way.</p>
<ul><li><strong>MySQL InnoDB</strong>: the primary key is always the clustered index. Secondary indexes store the primary key value, so a lookup through a secondary index then searches the PK tree.</li><li><strong>SQL Server</strong>: you choose the clustered index (by default the PK). Others are non-clustered.</li><li><strong>SQLite</strong>: ordinary tables are clustered on the rowid (your <code>INTEGER PRIMARY KEY</code>).</li><li><strong>PostgreSQL</strong>: tables are heaps (unordered); all indexes are secondary.</li></ul>
<p>A <strong>non-clustered</strong> (secondary) index is a separate tree whose leaves point to the rows.</p>`,
      predict: {
        q: 'Why should a MySQL InnoDB primary key usually be short (for example an integer and not a long text)?',
        options: ['Text keys are not allowed', 'Every secondary index stores the primary key, so a long key makes all indexes bigger', 'Long keys make COUNT(*) wrong', 'InnoDB cannot sort text'],
        answer: 1,
        why: 'Secondary index leaves in InnoDB hold the primary key value as the row pointer. A wide PK is copied into every index.'
      }
    }
  ],

<p>ORMs save time, but you still need SQL: to read the SQL they generate, to fix slow pages, and to write reports. The famous ORM trap is the <strong>N+1 problem</strong>: load 100 appointments (1 query), then for each one load its patient (100 more queries). The fix is one query with a JOIN (in ORMs: "eager loading", e.g. <code>joinedload</code> or <code>Include</code>).</p>

<p><strong>CAP theorem in three sentences.</strong> A distributed database can be <em>Consistent</em> (every read sees the latest write), <em>Available</em> (every request gets an answer) and <em>Partition-tolerant</em> (works when the network splits). Network splits will happen, so P is not optional. During a split, the system must choose: refuse some requests to stay consistent (CP) or answer with possibly old data (AP).</p>

<script>
(function () {

const addDays = (s, k) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + k); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };

/* ---------------- progress store ---------------- */
const LS_KEY = 'relational-lab-progress-v1';

const remote = { db: null, ref: null, ok: false, saving: false, again: false };
function lsGet() { try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

function mergeIn(o) { if (o && typeof o === 'object' && (o.updatedAt || 0) >= (P.updatedAt || 0)) P = Object.assign({}, P, o); }
mergeIn(lsGet());

/* ---------------- SQL engine ---------------- */
let SQL = null, BASE = null;
const expectedCache = {};
async function initEngine() {
  SQL = await initSqlJs();
  const db = new SQL.Database();
  db.exec(LAB.SCHEMA_SQL); db.exec(LAB.buildSeedSQL());
  BASE = db.export(); db.close();
}
function freshDB(setup) { const d = new SQL.Database(BASE); d.exec('PRAGMA foreign_keys = ON;'); if (setup) d.exec(setup); return d; }
function runAll(db, sql) {
  const t0 = performance.now();

    for (const st of db.iterateStatements(sql)) {

}
function planText(db, q) { const r = db.exec('EXPLAIN QUERY PLAN ' + q); return r.length ? r[0].values.map(v => v[v.length - 1]).join(' | ') : ''; }

function rowsKey(set) { return set.values.map(r => JSON.stringify(r.map(norm))); }
function compareSets(exp, got, ordered) {
  if (!got) return { pass: false, msg: 'Your SQL did not return a result table.', sub: 'The last statement must be a SELECT.' };
  if (exp.columns.length !== got.columns.length) return { pass: false, msg: 'Expected ' + exp.columns.length + ' column' + (exp.columns.length > 1 ? 's' : '') + ', you returned ' + got.columns.length + '.', sub: 'Check the column list the question asks for, and its order.' };
  const a = rowsKey(exp), b = rowsKey(got);
  if (a.length !== b.length) return { pass: false, msg: 'Expected ' + a.length + ' row' + (a.length === 1 ? '' : 's') + ', you returned ' + b.length + '.', sub: b.length > a.length ? 'Too many rows: a filter or a join condition may be missing, or you need DISTINCT / GROUP BY.' : 'Too few rows: a filter may be too strict, or you may need an outer join.' };
  if (ordered) {
    if (a.every((r, i) => r === b[i])) return { pass: true };
    const sa = a.slice().sort(), sb = b.slice().sort();
    if (sa.every((r, i) => r === sb[i])) return { pass: false, msg: 'Right rows, wrong order.', sub: 'Read the sorting part of the question again (direction and tie-breaker).' };
  } else {
    const sa = a.slice().sort(), sb = b.slice().sort();
    if (sa.every((r, i) => r === sb[i])) return { pass: true };
  }
  const setA = new Set(a); const extra = b.find(r => !setA.has(r));
  return { pass: false, msg: 'Same shape, but some values differ.', sub: extra ? 'For example, this row of yours is not in the expected result: ' + JSON.parse(extra).join(' | ') : 'Compare your values with the expected result.' };
}
function expectedFor(ex) {
  if (expectedCache[ex.id]) return expectedCache[ex.id];
  const d = freshDB(ex.setup);
  let set = null;
  if (ex.kind === 'script') { d.exec(ex.solution); if (ex.check) { const r = runAll(d, ex.check); set = r.sets[r.sets.length - 1]; } }
  else { const r = runAll(d, ex.solution); set = r.sets[r.sets.length - 1]; }
  d.close();
  return (expectedCache[ex.id] = set);
}
function grade(ex, sql) {
  const d = freshDB(ex.setup);
  const run = runAll(d, sql);
  let res;
  if (!run.ok) res = { pass: false, msg: 'The database rejected your SQL.', sub: run.error, run };
  else if (ex.kind === 'script' && ex.plan) {
    let plan = '';
    try { plan = planText(d, ex.plan.query); } catch (e) { plan = 'error: ' + e.message; }
    const pass = plan.indexOf(ex.plan.mustContain) >= 0;
    res = { pass, run, plan, msg: pass ? '' : 'The query plan does not use the index yet.', sub: pass ? '' : 'Plan now: ' + plan };
  } else if (ex.kind === 'script') {
    const r = runAll(d, ex.check);
    const got = r.ok ? r.sets[r.sets.length - 1] : null;
    res = Object.assign(compareSets(expectedFor(ex), got, true), { run, checkSet: got });
    if (!res.pass) res.msg = 'The database is not in the expected state. ' + res.msg;
  } else {
    res = Object.assign(compareSets(expectedFor(ex), run.sets[run.sets.length - 1], !!ex.ordered), { run });
  }
  d.close();

}

/* ---------------- SQL highlighting + editor ---------------- */
const KW = new Set(('select from where and or not in is null like between group by having order asc desc limit offset as distinct join inner left right full outer cross natural on using union all intersect except exists case when then else end create table primary key foreign references unique check default insert into values update set delete drop alter add column index view trigger begin commit rollback savepoint release transaction with recursive over partition rows range preceding following current row unbounded if replace conflict do nothing returning explain query plan pragma cascade restrict no action collate glob escape filter window before after instead of for each autoincrement integer text real numeric blob varchar date boolean decimal true false to rename temp temporary vacuum analyze grant revoke deferrable initially deferred immediate exclusive abort fail ignore raise strict without rowid row_number rank dense_rank ntile lag lead first_value last_value cast').split(' '));
function hl(src) {
  let out = '', i = 0; const s = String(src);
  while (i < s.length) {
    const c = s[i], rest = s.slice(i);
    let m;
    if (rest.startsWith('--')) { const e = s.indexOf('\n', i); const j = e < 0 ? s.length : e; out += '<span class="tk-cmt">' + esc(s.slice(i, j)) + '</span>'; i = j; continue; }
    if (rest.startsWith('/*')) { const e = s.indexOf('*/', i + 2); const j = e < 0 ? s.length : e + 2; out += '<span class="tk-cmt">' + esc(s.slice(i, j)) + '</span>'; i = j; continue; }
    if (c === "'") { let j = i + 1; while (j < s.length) { if (s[j] === "'" && s[j + 1] === "'") { j += 2; continue; } if (s[j] === "'") { j++; break; } j++; } out += '<span class="tk-str">' + esc(s.slice(i, j)) + '</span>'; i = j; continue; }
    if ((m = /^\d+(\.\d+)?/.exec(rest)) && !/[A-Za-z_]/.test(s[i - 1] || '')) { out += '<span class="tk-num">' + m[0] + '</span>'; i += m[0].length; continue; }
    if ((m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(rest))) {
      const w = m[0];
      if (KW.has(w.toLowerCase())) out += '<span class="tk-kw">' + w + '</span>';
      else if (s[i + w.length] === '(') out += '<span class="tk-fn">' + w + '</span>';
      else out += esc(w);
      i += w.length; continue;
    }
    out += esc(c); i++;
  }
  return out + '\n';
}
const editors = {};
function editorHTML(key, value, rows) {

}
function gridHTML(set, extraMeta) {

  body.innerHTML = h;
  const ta = $('#teachText');
  ta.addEventListener('input', () => { P.teach[day.n] = Object.assign({}, P.teach[day.n] || {}, { text: ta.value }); if (!ta.value.trim()) delete P.teach[day.n]; save(); });
  $('#teachSelf').onclick = () => {
    $('#teachOut').innerHTML = '<div class="fbk"><h3>Key points a complete answer covers</h3><p>' + esc(day.rubric) + '</p><p class="note">Tick them off against what you wrote. Anything missing is your next thing to review.</p></div>';
    if (ta.value.trim()) { P.teach[day.n] = Object.assign({}, P.teach[day.n] || {}, { text: ta.value, self: true }); save(); renderRail(); }
  };
  if (sampleFn) {
    const b = $('#teachAI'); b.hidden = false;
    b.onclick = async () => {
      const text = ta.value.trim();
      if (text.length < 40) { toast('Write a few sentences first.'); return; }
      b.disabled = true; $('#teachOut').innerHTML = '<div class="fbk note">The professor is reading your explanation…</div>';
      const prompt = 'You are a database professor grading a student\'s explanation. Be kind but precise.\n' +
        'Topic prompt: ' + day.teach + '\nKey points a complete answer covers: ' + day.rubric + '\n\nStudent answer:\n"""\n' + text.slice(0, 6000) + '\n"""\n\n' +
        'Reply with only a JSON object: {"score": integer 0-10, "strengths": [short strings], "missing": [key points not covered], "misconceptions": [factual errors, empty if none], "better": "a model explanation in 4-6 plain sentences", "followup": "one question that tests the weakest part"}.' + (P.lang === 'ar' ? ' Write all string values in Arabic (keep SQL keywords and table names in English).' : ' Use simple English.');
      try {
        const fb = await sampleFn.json(prompt, { modelTier: 'default' });
        P.teach[day.n] = { text, score: Number(fb.score) || 0, fb }; save(); renderRail();
        $('#teachOut').innerHTML = teachFbHTML(fb); $('#teachNote').textContent = 'Last score: ' + (Number(fb.score) || 0) + '/10';
      } catch (e) {
        $('#teachOut').innerHTML = '<div class="fbk">' + esc(sampleErrorText(e)) + '</div>';
        if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled')) b.hidden = true;
      }
      b.disabled = false;
    };
  }
}
function teachFbHTML(fb) {
  const list = (t, a) => (a && a.length) ? '<h3>' + t + '</h3><ul>' + a.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '';
  const sc = Math.max(0, Math.min(10, Number(fb.score) || 0));
  return '<div class="fbk"><h3>Score ' + sc + '/10</h3><div class="meterbar"><i style="width:' + sc * 10 + '%"></i></div>' + list('What you did well', fb.strengths) + list('Missing', fb.missing) + list('Fix these misunderstandings', fb.misconceptions) + (fb.better ? '<h3>A model explanation</h3><p>' + esc(fb.better) + '</p>' : '') + (fb.followup ? '<h3>Test yourself</h3><p>' + esc(fb.followup) + '</p>' : '') + '</div>';
}

/* ---------------- views: review ---------------- */
const INTERVALS = [0, 1, 3, 7, 14, 30];
let reviewQueue = null, reviewAns = null;
function viewReview() {
  if (!reviewQueue) { reviewQueue = dueCards().sort(() => Math.random() - 0.5); reviewAns = null; }
  const counts = [1, 2, 3, 4, 5].map(b => Object.keys(P.cards).filter(id => P.cards[id].box === b).length);
  let h = '<div class="col"><header class="dayhead"><div class="eyebrow">Spaced review</div><h1>Review</h1><p class="note" style="max-width:62ch">Questions you answered in Recall come back here on a schedule. A correct answer moves the card to the next box and it waits longer: 1, 3, 7, 14, then 30 days. A wrong answer sends it back to box 1.</p></header>' +
    '<div class="boxes">' + counts.map((c, i) => '<div><b>' + c + '</b><small>Box ' + (i + 1) + ' · ' + INTERVALS[i + 1] + 'd</small></div>').join('') + '</div>';
  if (!reviewQueue.length) {
    const total = Object.keys(P.cards).length;
    const next = Object.values(P.cards).map(c => c.due).sort()[0];
    h += '<div class="quiz"><div class="qq">' + (total ? 'Nothing due right now.' : 'Your deck is empty.') + '</div><p class="note">' + (total ? 'Next card is due on ' + next + '. Come back then, or continue with today\'s lesson.' : 'Finish a Recall quiz and its questions land here.') + '</p><div class="next-row"><span></span><a class="btn primary" href="#day-' + nextDay() + '">Go to Day ' + nextDay() + '</a></div></div>';
    $('#main').innerHTML = h + '</div>'; reviewQueue = null; return;
  }
  const id = reviewQueue[0]; const { q, day } = quizById(id);
  h += '<div class="quiz"><div class="qn"><span>' + reviewQueue.length + ' left · from Day ' + day.n + ' (' + esc(day.tag) + ')</span><span>Box ' + P.cards[id].box + '</span></div><div class="qq">' + q.q + '</div><div class="opts">' +
    q.options.map((o, i) => { const cls = reviewAns === null ? '' : i === q.answer ? ' right' : i === reviewAns ? ' wrong' : ''; return '<button class="opt' + cls + '" data-ropt="' + i + '"' + (reviewAns !== null ? ' disabled' : '') + '><b>' + 'ABCDEF'[i] + '</b><span>' + o + '</span></button>'; }).join('') + '</div>';
  if (reviewAns !== null) h += '<div class="why"><strong>' + (reviewAns === q.answer ? 'Correct.' : 'Not quite.') + '</strong> ' + q.why + '</div><div class="next-row" style="margin-top:14px"><span></span><button class="btn primary" data-rnext="1">Next →</button></div>';
  $('#main').innerHTML = h + '</div></div>';
  $('#main').onclick = e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.ropt !== undefined) {
      reviewAns = Number(t.dataset.ropt);
      const c = P.cards[id];
      if (reviewAns === q.answer) { c.box = Math.min(5, c.box + 1); c.due = addDays(todayStr(), INTERVALS[c.box]); }
      else { c.box = 1; c.due = addDays(todayStr(), 1); reviewQueue.push(id); }
      save(); renderRail(); viewReview();
    } else if (t.dataset.rnext) { reviewQueue.shift(); if (reviewQueue[0] === id && reviewQueue.length > 1) reviewQueue.push(reviewQueue.shift()); reviewAns = null; viewReview(); }
  };
}

/* ---------------- views: playground ---------------- */
let PG = null; let pgRun = null; let pgHist = [];
function schemaHTML(db) {
  let h = '<div class="schema">';
  const tables = db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY rowid");
  (tables[0] ? tables[0].values : []).forEach(([t]) => {
    const cols = db.exec("SELECT name, type, pk, \"notnull\" FROM pragma_table_info('" + t.replace(/'/g, "''") + "')")[0];
    const fks = db.exec("SELECT \"from\", \"table\" FROM pragma_foreign_key_list('" + t.replace(/'/g, "''") + "')");
    const fkMap = {}; (fks[0] ? fks[0].values : []).forEach(([f, tt]) => { fkMap[f] = tt; });
    let n = 0; try { n = db.exec('SELECT COUNT(*) FROM "' + t.replace(/"/g, '""') + '"')[0].values[0][0]; } catch (e) {}
    h += '<details><summary>' + esc(t) + '<small>' + n + ' rows</small></summary><div class="cols">' + (LAB.TABLE_NOTES[t] ? '<p>' + esc(LAB.TABLE_NOTES[t]) + '</p>' : '') +
      (cols ? cols.values : []).map(([c, ty, pk]) => '<div class="c"><span class="' + (pk ? 'k' : fkMap[c] ? 'fk' : '') + '">' + esc(c) + (pk ? ' · PK' : '') + (fkMap[c] ? ' → ' + esc(fkMap[c]) : '') + '</span><span>' + esc((ty || '').toLowerCase()) + '</span></div>').join('') + '</div></details>';
  });
  return h + '</div>';
}
function viewPlayground() {
  if (!PG) PG = freshDB();
  const v = editors['pg'] !== undefined ? editors['pg'] : "-- Anything goes here. Changes persist until you reset.\nSELECT s.name, d.name AS major, s.year\nFROM students s\nLEFT JOIN departments d ON d.dept_id = s.dept_id\nORDER BY s.year DESC, s.name;";
  $('#main').innerHTML = '<div class="col" style="max-width:1180px"><header class="dayhead"><div class="eyebrow">Free practice</div><h1>SQL playground</h1><p class="note">One database that keeps your changes while this page is open. Experiment freely: create tables, delete rows, break things, then reset.</p></header>' +
    '<div class="pg"><div style="min-width:0"><div class="console">' + editorHTML('pg', v, 8) + '<div class="toolbar"><button class="btn primary small" id="pgRun">Run</button><button class="btn small" id="pgPlan">Explain plan</button><button class="btn ghost small" id="pgReset">Reset database</button><button class="btn ghost small tutor-only" id="pgAsk" hidden>Ask about this query</button><span class="hint-k">Ctrl/⌘ + Enter</span></div><div class="out" id="pgOut"' + (pgRun ? '' : ' hidden') + '>' + runResultHTML(pgRun) + '</div></div>' +
    '<div class="history" id="pgHist">' + (pgHist.length ? '<div class="eyebrow" style="margin-bottom:6px">History</div>' + pgHist.map((q, i) => '<button data-h="' + i + '" title="' + esc(q) + '">' + esc(q.replace(/\s+/g, ' ')) + '</button>').join('') : '') + '</div></div>' +
    '<aside><div class="eyebrow" style="margin-bottom:8px">Schema</div><div id="pgSchema">' + schemaHTML(PG) + '</div></aside></div></div>';
  const run = (sql, plan) => {
    const q = sql.trim().replace(/;\s*$/, '');
    pgRun = plan ? runAll(PG, 'EXPLAIN QUERY PLAN ' + q) : runAll(PG, sql);
    if (sql.trim() && pgHist[0] !== sql.trim()) { pgHist.unshift(sql.trim()); pgHist = pgHist.slice(0, 12); }
    lastRun = { sql, error: pgRun.ok ? null : pgRun.error, where: 'playground' };
    viewPlayground();
  };
  mountEditors($('#main'), (k, val) => run(val));
  $('#pgRun').onclick = () => run(editors['pg'] !== undefined ? editors['pg'] : v);
  $('#pgPlan').onclick = () => run(editors['pg'] !== undefined ? editors['pg'] : v, true);
  $('#pgReset').onclick = () => { PG.close(); PG = freshDB(); pgRun = null; toast('Database reset to the original data'); viewPlayground(); };
  $('#pgHist').onclick = e => { const b = e.target.closest('button[data-h]'); if (b) { editors['pg'] = pgHist[Number(b.dataset.h)]; viewPlayground(); } };
  $('#pgAsk').onclick = () => { lastRun = { sql: editors['pg'] !== undefined ? editors['pg'] : v, error: pgRun && !pgRun.ok ? pgRun.error : null, where: 'playground' }; openTutor(); askTutor(lastRun.error ? 'Explain this error and how to fix it.' : 'Explain what this query does, step by step, and whether it could be written better.'); };
  tutorButtons();
  setTutorContext();
}

/* ---------------- tutor (sample capability) ---------------- */
let sampleFn = null, turns = [], tutorCtl = null, lastRun = null;
function sampleErrorText(e) {
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled') return 'The professor is not available in this view. The rest of the lab works normally.';
  if (c === 'rate_limited') return 'Too many questions in a short time. Wait a minute and ask again.';
  if (c === 'session_expired') return 'Your session expired. Sign in again to use the professor.';
  if (c === 'refused') return 'The professor could not answer that. Try asking in a different way.';
  if (c === 'prompt_too_large') return 'That is too much text at once. Shorten your question or query.';
  return 'The answer was interrupted. Try again.';
}
function tutorButtons() { $$('.tutor-only').forEach(b => { b.hidden = !sampleFn; }); }
function schemaSummary() {
  return 'Tables (SQLite): departments(dept_id PK, name, building, budget); instructors(instructor_id PK, name, dept_id FK, salary, hire_date, mentor_id FK->instructors); students(student_id PK, name, email, dept_id FK (NULL=undeclared), year 1-4, city, birth_date, advisor_id FK->instructors, enrolled_on); courses(course_id PK text, title, dept_id FK, credits); prereqs(course_id FK, prereq_id FK, PK both); sections(section_id PK, course_id FK, instructor_id FK, semester, year, room, capacity); enrollments(student_id FK, section_id FK, grade A-F or NULL in progress, score, PK both); payments(payment_id PK, student_id FK, amount, paid_on, method).';
}
function contextText() {
  let c = 'Where the student is: ';
  if (current.view === 'day') { const d = byN(current.day); c += 'Day ' + d.n + ' of a 14-day database course, topic "' + d.title + '" (' + d.tag + '), tab ' + (P.tab[d.n] || 'learn') + '.'; }
  else c += current.view + ' page.';
  if (lastRun) {
    if (lastRun.ex) c += '\nExercise they are on: ' + lastRun.ex.prompt.replace(/<[^>]+>/g, '') + (lastRun.ex.setup ? '\nSetup SQL for it: ' + lastRun.ex.setup.slice(0, 1500) : '') + '\nModel solution (PRIVATE: never reveal it or write it out; use it only to guide hints): ' + lastRun.ex.solution;
    c += '\nTheir latest SQL (' + lastRun.where + '):\n' + String(lastRun.sql || '').slice(0, 3000) + (lastRun.error ? '\nResult/feedback: ' + lastRun.error : '\nIt ran without error.');
  }
  return c;
}
function rules() {
  return 'You are "the professor": a senior database engineer and university professor tutoring one student through a 14-day database course that runs SQLite in the browser. ' +
    'Teach Socratically: give the smallest helpful hint first, ask a guiding question, and only write a full solution if the student explicitly asks for it after trying. Explain WHY, connect to theory (relational model, keys, normalization, ACID, indexes) when useful, and mention differences in PostgreSQL/MySQL/SQL Server/Oracle when relevant. ' +
    'Keep answers short (under 180 words unless asked for more). Use plain text; put SQL in fenced code blocks. ' +
    (P.lang === 'ar' ? 'Answer in Arabic (Modern Standard, simple). Keep SQL, table and column names in English. ' : 'Use simple, clear English: the student is not a native speaker. ') +
    '\n\n' + schemaSummary();
}
function setTutorContext() {
  let t = 'Context: ';
  if (current.view === 'day') { const d = byN(current.day); t += 'Day ' + d.n + ' · ' + d.tag + ' · ' + (P.tab[d.n] || 'learn'); }
  else t += current.view;
  if (lastRun) t += ' · last SQL from ' + lastRun.where;
  $('#tutorCtx').textContent = t;
  const chips = current.view === 'day' ? ['Explain today\'s topic simply', 'Quiz me with 3 questions', 'Give me a harder exercise', 'What do exams ask about this?'] : ['What should I study next?', 'Quiz me on joins', 'Explain normalization simply'];
  $('#chips').innerHTML = chips.map(c => '<button class="chip">' + esc(c) + '</button>').join('');
}
function fmtMsg(text) {
  const parts = String(text).split(/```(?:sql|SQL)?\n?/);
  return parts.map((p, i) => i % 2 ? '<pre>' + hl(p.replace(/\n$/, '')) + '</pre>' : esc(p).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')).join('');
}
function renderMsgs() {
  const box = $('#msgs');
  box.innerHTML = '<div class="msg sys">Ask about the current lesson, your query, or any database topic. The professor sees what you are working on.</div>' + turns.map(t => '<div class="msg ' + (t.role === 'user' ? 'me' : 'ai') + '">' + (t.role === 'user' ? esc(t.content) : fmtMsg(t.content)) + '</div>').join('');
  box.scrollTop = box.scrollHeight;
}
function openTutor() { $('#drawer').classList.add('open'); $('#scrim').hidden = false; setTutorContext(); setTimeout(() => $('#tutorInput').focus(), 50); }
function closeTutor() { $('#drawer').classList.remove('open'); $('#scrim').hidden = true; }
async function askTutor(text) {
  if (!sampleFn || !text.trim()) return;
  if (tutorCtl) tutorCtl.abort();
  turns.push({ role: 'user', content: text.trim() });
  turns = turns.slice(-12);
  renderMsgs();
  const box = $('#msgs');
  const bubble = document.createElement('div'); bubble.className = 'msg ai'; bubble.textContent = 'Thinking…'; box.appendChild(bubble); box.scrollTop = box.scrollHeight;
  tutorCtl = new AbortController();
  $('#stopTutor').hidden = false; $('#sendTutor').disabled = true;
  const history = turns.map((t, i) => i === turns.length - 1 ? { role: 'user', content: 'CURRENT CONTEXT\n' + contextText() + '\n\nSTUDENT: ' + t.content } : t);
  try {
    const { text: ans } = await sampleFn([{ role: 'user', content: rules() }].concat(history[0].role === 'assistant' ? history.slice(1) : history), {
      cache: false, signal: tutorCtl.signal,
      onText: ({ text }) => { bubble.innerHTML = fmtMsg(text); box.scrollTop = box.scrollHeight; }
    });
    turns.push({ role: 'assistant', content: ans });
  } catch (e) {
    if (e && e.text) { turns.push({ role: 'assistant', content: e.text }); }
    if (e && e.code === 'cancelled') { if (!e.text) bubble.remove(); }
    else { bubble.textContent = (e && e.text ? e.text + '\n\n' : '') + sampleErrorText(e); }
    if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled')) { sampleFn = null; $('#tutorBtn').hidden = true; tutorButtons(); }
  }
  tutorCtl = null; $('#stopTutor').hidden = true; $('#sendTutor').disabled = false;
  if (turns.length && turns[turns.length - 1].role === 'assistant') renderMsgs();
}
async function connectTutor() {
  if (!window.claude || !window.claude.use) return;
  try { sampleFn = await window.claude.use('sample'); } catch (e) { sampleFn = null; }
  if (!sampleFn) return;
  $('#tutorBtn').hidden = false; tutorButtons();
  if (current.view === 'day' && (P.tab[current.day] || 'learn') === 'explain') route();
}

/* ---------------- router ---------------- */
function route() {
  const h = (location.hash || '#home').slice(1);
  let m;
  closeRail();
  if ((m = /^day-(\d+)$/.exec(h)) && byN(Number(m[1]))) { current = { view: 'day', day: Number(m[1]) }; renderRail(); viewDay(current.day); }
  else if (h === 'playground') { current = { view: 'playground' }; renderRail(); viewPlayground(); }
  else if (h === 'review') { current = { view: 'review' }; reviewQueue = null; renderRail(); viewReview(); }
  else { current = { view: 'home' }; renderRail(); viewHome(); }
  updateChrome(); setTutorContext();
}
window.addEventListener('hashchange', () => { route(); window.scrollTo({ top: 0 }); });
$('#menuBtn').onclick = () => { $('#rail').classList.add('open'); $('#scrim').hidden = false; };
$('#scrim').onclick = () => { closeRail(); closeTutor(); };
$('#tutorBtn').onclick = openTutor;
$('#closeTutor').onclick = closeTutor;
$('#sendTutor').onclick = () => { const t = $('#tutorInput'); const v = t.value; t.value = ''; askTutor(v); };
$('#tutorInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#sendTutor').click(); } });
$('#stopTutor').onclick = () => { if (tutorCtl) tutorCtl.abort(); };
$('#clearTutor').onclick = () => { if (tutorCtl) tutorCtl.abort(); turns = []; renderMsgs(); };
$('#chips').onclick = e => { const b = e.target.closest('.chip'); if (b) askTutor(b.textContent); };
$('#langToggle').onclick = e => { const b = e.target.closest('button'); if (!b) return; P.lang = b.dataset.lang; save(); $$('#langToggle button').forEach(x => x.classList.toggle('on', x === b)); };
$$('#langToggle button').forEach(x => x.classList.toggle('on', x.dataset.lang === (P.lang || 'en')));

initEngine().then(() => { route(); }).catch(err => {
  $('#main').innerHTML = '<div class="loading">The SQL engine could not load (' + esc(err && err.message || err) + ').<br>Check your connection and reload the page.</div>';
});
renderRail(); updateChrome();
connectTutor();
connectRemote();
})();
</script>
